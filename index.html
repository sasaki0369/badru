<style>
:root{
  --bg:#000000;
  --white:#ffffff;
  --yellow:#ffd400;
  --orange:#ff8c1a;
  --dim:#6b6b6b;
  --panel:#111214;
  --line:#2a2c30;
  --accent:#3b82f6;
  --danger:#e5484d;

  /* ---- 柔らかい配色（設定画面・ボタン・スコアシート用） ---- */
  --soft-bg:#fdf6ee;
  --soft-surface:#ffffff;
  --soft-card:#fffaf3;
  --soft-primary:#ffa374;
  --soft-primary-dark:#ec8552;
  --soft-secondary:#8fd0c3;
  --soft-secondary-dark:#5fb3a3;
  --soft-danger:#f2968a;
  --soft-danger-dark:#e17a6d;
  --soft-text:#5c4a3a;
  --soft-text-dim:#a6917e;
  --soft-border:#f0e2d0;
  --soft-shadow:0 6px 16px rgba(180,140,100,0.16);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:var(--bg); color:var(--white);
  font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
  overscroll-behavior:none;
  overflow:hidden;
}
#app{ position:fixed; inset:0; }

/* ---------- 横固定（縦持ち時は回転させて横画面として扱う） ---------- */
.rotor{
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  transform-origin:center center;
  display:none;
  pointer-events:none;
}
.rotor.active{
  display:block;
  pointer-events:auto;
}
@media (orientation:portrait){
  .rotor.active{
    width:100vh;
    height:100vw;
    top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(90deg);
  }
}

/* ---------- スコアボード画面 ---------- */
#board{
  position:relative;
  width:100%; height:100%;
  display:none;
  flex-direction:column;
  background:var(--bg);
}
#board.active{ display:flex; }

.board-main{
  flex:1;
  display:flex;
  min-height:0;
}
.side{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  position:relative;
  padding:1vh 3.2vw;
  min-width:0;
  min-height:0;
  border-right:1px solid #1a1a1a;
}
.side:last-child{ border-right:none; }
.side.serving{ background:rgba(255,212,0,0.05); }

.score-zone{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.score-num{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ---------- フリップボード風スコアカード ---------- */
.flip-card{
  position:relative;
  height:min(38vh, 32vw);
  aspect-ratio:0.68;
  background:linear-gradient(180deg, #1e1e1e 0%, #131313 49%, #0c0c0c 51%, #060606 100%);
  border:1px solid #2e2e2e;
  border-radius:10px;
  box-shadow:0 10px 22px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.05);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.flip-card::before{
  content:'';
  position:absolute;
  left:5%; right:5%; top:50%;
  height:2px;
  background:rgba(0,0,0,0.55);
  box-shadow:0 1px 0 rgba(255,255,255,0.05);
}
.flip-card .ring{
  position:absolute;
  top:-6%;
  width:11%;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #d8d8d8, #7a7a7a 55%, #3a3a3a 100%);
  box-shadow:0 1px 2px rgba(0,0,0,0.7);
}
.flip-card .ring.l{ left:14%; }
.flip-card .ring.r{ right:14%; }
.flip-card .digit{
  font-size:0.68em;
  font-weight:900;
  line-height:1;
  color:var(--white);
  font-variant-numeric:tabular-nums;
  text-shadow:0 3px 0 rgba(0,0,0,0.55);
  -webkit-text-stroke:0.5px rgba(0,0,0,0.25);
  transform:translateY(-2%);
  transition:color .15s;
}
.side.serving .flip-card .digit{ color:var(--yellow); }
.flip-card:nth-child(1){ transform:rotate(-1.6deg); }
.flip-card:nth-child(2){ transform:rotate(1.2deg); }

.court-slots{
  flex:0 0 auto;
  display:flex;
  gap:3vw;
  margin-top:0.6vh;
  width:100%;
  justify-content:center;
}
.slot{
  flex:0 1 auto;
  min-width:0;
  max-width:46%;
  text-align:center;
  font-size:min(4.2vw, 4.6vh);
  font-weight:700;
  color:var(--white);
  padding:0.4vh 0.8vw;
  border-radius:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:opacity .15s;
}
.slot.empty{ visibility:hidden; }
.slot.server{ color:var(--orange); }
.slot.active-box{ box-shadow:inset 0 -3px 0 currentColor; }

.mid-divider{
  width:3px;
  align-self:stretch;
  margin:0 0.6vw;
  background:linear-gradient(to bottom, transparent, #444 12%, #444 88%, transparent);
}

.game-target-badge{
  position:absolute;
  top:1.2vh;
  left:50%;
  transform:translateX(-50%);
  font-size:min(2.6vw,2.4vh);
  color:var(--dim);
  letter-spacing:0.05em;
}

.set-status{
  position:absolute;
  top:1.2vh;
  right:1.5vw;
  font-size:min(2.4vw,2.2vh);
  color:var(--dim);
}

/* ---------- 下部ボタン行 ---------- */
.controls{
  display:flex;
  height:9vh;
  min-height:52px;
  border-top:1px solid #1c1c1c;
  background:#050505;
  gap:1.5vw;
  padding:0.8vh 1.5vw;
}
.controls button{
  flex:1;
  background:rgba(255,255,255,0.06);
  color:var(--white);
  border:none;
  border-radius:12px;
  font-size:min(3.4vw,2.4vh);
  font-weight:600;
  letter-spacing:0.05em;
}
.controls button:active{ background:rgba(255,255,255,0.14); }
.controls button.undo-btn{ color:var(--soft-text-dim); }
.controls button.change-btn{ color:var(--soft-secondary); }
.controls button.stop-btn{ color:var(--soft-danger); }
.controls button:disabled{ color:#3a3a3a; }

/* ---------- 設定画面（縦画面固定・柔らかい配色・大きめUI） ---------- */
#settings{
  position:relative;
  width:100%; height:100%;
  overflow-y:auto;
  background:var(--soft-bg);
  color:var(--soft-text);
  padding:28px 20px 48px;
  display:none;
}
#settings.active{ display:block; }
#settings > *{
  max-width:520px;
  margin-left:auto;
  margin-right:auto;
}
.settings-title{
  font-size:clamp(24px, 7vw, 30px);
  font-weight:800;
  margin:4px auto 22px;
  display:flex;
  align-items:center;
  gap:0.5em;
  color:var(--soft-text);
}
.settings-title .shuttle{ font-size:1.1em; }

.field{
  margin-bottom:22px;
}
.field label{
  display:block;
  font-size:clamp(15px, 4.2vw, 17px);
  font-weight:600;
  color:var(--soft-text-dim);
  margin-bottom:10px;
  letter-spacing:0.02em;
}
.seg{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.seg button{
  flex:1;
  min-width:96px;
  min-height:52px;
  padding:14px 8px;
  background:var(--soft-surface);
  border:1.5px solid var(--soft-border);
  color:var(--soft-text);
  border-radius:14px;
  font-size:clamp(16px, 4.5vw, 19px);
  font-weight:700;
  box-shadow:var(--soft-shadow);
}
.seg button.on{
  background:var(--soft-primary);
  color:#fff;
  border-color:var(--soft-primary);
}
input[type="text"], input[type="number"]{
  width:100%;
  min-height:52px;
  padding:12px 14px;
  background:var(--soft-surface);
  border:1.5px solid var(--soft-border);
  color:var(--soft-text);
  border-radius:12px;
  font-size:clamp(16px, 4.5vw, 19px);
}
select{
  width:100%;
  min-height:52px;
  padding:12px 14px;
  background:var(--soft-surface);
  border:1.5px solid var(--soft-border);
  color:var(--soft-text);
  border-radius:12px;
  font-size:clamp(16px, 4.5vw, 19px);
}
.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.two-col-swap{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  align-items:center;
}
.swap-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--soft-surface);
  border:1.5px solid var(--soft-border);
  color:var(--soft-primary-dark);
  font-size:20px;
  font-weight:800;
  box-shadow:var(--soft-shadow);
}
.swap-btn:active{ background:var(--soft-primary); color:#fff; }
.team-block{
  background:var(--soft-card);
  border:1.5px solid var(--soft-border);
  border-radius:16px;
  padding:16px 14px;
  margin-bottom:12px;
  box-shadow:var(--soft-shadow);
}
.team-block .team-label{
  font-size:clamp(14px, 4vw, 16px);
  color:var(--soft-text-dim);
  margin-bottom:10px;
  font-weight:700;
}
.team-block input{ margin-bottom:10px; }
.team-block input:last-child{ margin-bottom:0; }

.deuce-max-row{ display:none; margin-top:14px; }
.deuce-max-row.show{ display:block; }
.custom-points-row{ display:none; margin-top:14px; }
.custom-points-row.show{ display:block; }

.start-btn{
  width:100%;
  min-height:60px;
  padding:18px 0;
  background:linear-gradient(135deg, var(--soft-primary), var(--soft-primary-dark));
  color:#fff;
  border:none;
  border-radius:16px;
  font-size:clamp(19px, 5.5vw, 23px);
  font-weight:800;
  margin-top:24px;
  box-shadow:var(--soft-shadow);
}
.start-btn:disabled{
  background:#e9ddd0;
  color:#b7a897;
  box-shadow:none;
}
.hint{
  font-size:clamp(13px, 3.6vw, 15px);
  color:var(--soft-text-dim);
  margin-top:8px;
  line-height:1.5;
}
.err{
  color:var(--soft-danger-dark);
  font-size:clamp(14px, 4vw, 16px);
  font-weight:600;
  margin-top:12px;
  min-height:1em;
}

.icon-shuttle{ display:inline-block; }

.past-matches{
  margin-top:32px;
  border-top:1.5px solid var(--soft-border);
  padding-top:20px;
}
.past-matches h3{
  font-size:clamp(16px, 4.5vw, 18px);
  color:var(--soft-text-dim);
  margin:0 0 12px;
  font-weight:700;
}
.past-row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--soft-border);
  font-size:clamp(14px, 4vw, 16px);
  color:var(--soft-text);
}
.past-row button{
  background:none;
  border:none;
  color:var(--soft-primary-dark);
  font-size:inherit;
  font-weight:600;
}

/* 設定を開く小ボタン（試合中） */
.gear-btn{
  position:absolute;
  top:1vh; left:1vw;
  width:8vw; height:8vw;
  max-width:44px; max-height:44px;
  min-width:32px; min-height:32px;
  background:rgba(255,255,255,0.06);
  border:none;
  border-radius:50%;
  color:var(--soft-text-dim);
  font-size:min(3vw,2.4vh);
  z-index:5;
}

/* ---------- スコアシート（モーダル・柔らかい配色） ---------- */
#sheetOverlay{
  position:fixed; inset:0;
  background:rgba(92,74,58,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:2vh 2vw;
}
#sheetOverlay.active{ display:flex; }
.sheet{
  background:var(--soft-bg);
  border:1px solid var(--soft-border);
  border-radius:20px;
  width:100%;
  max-width:640px;
  max-height:94vh;
  overflow-y:auto;
  padding:3vh 3vw;
  color:var(--soft-text);
  box-shadow:0 12px 30px rgba(92,74,58,0.25);
}
.sheet h2{
  margin:0 0 0.4vh;
  font-size:min(4vw,3vh);
  color:var(--soft-text);
}
.sheet .sub{
  color:var(--soft-text-dim);
  font-size:min(2.4vw,1.9vh);
  margin-bottom:2vh;
}
.sheet-result{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--soft-surface);
  border:1px solid var(--soft-border);
  border-radius:16px;
  padding:2vh 2vw;
  margin-bottom:2vh;
  box-shadow:var(--soft-shadow);
}
.sheet-result .name{ font-size:min(3vw,2.2vh); color:var(--soft-text); }
.sheet-result .name.win{ color:var(--soft-primary-dark); font-weight:800; }
.sheet-result .final-score{
  font-size:min(6vw,4.4vh);
  font-weight:800;
  color:var(--soft-text);
}
table.sheet-log{
  width:100%;
  border-collapse:collapse;
  font-size:min(2.4vw,1.8vh);
  margin-bottom:2vh;
}
table.sheet-log th, table.sheet-log td{
  border-bottom:1px solid var(--soft-border);
  padding:0.7vh 0.4vw;
  text-align:center;
}
table.sheet-log th{ color:var(--soft-text-dim); font-weight:600; }

/* ---------- 公式様式ヘッダー（期日・大会名等 ＋ 氏名登録表） ---------- */
.sheet-header-grid{
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  grid-template-rows:repeat(4, auto);
  gap:4px 10px;
  margin-bottom:16px;
  font-size:clamp(12px, 3.2vw, 14px);
}
.info-line{
  display:flex;
  align-items:flex-end;
  gap:4px;
  border-bottom:1px dashed var(--soft-border);
  padding-bottom:3px;
  color:var(--soft-text);
}
.sheet-header-grid > .info-line:nth-child(1){ grid-column:1; grid-row:1; }
.sheet-header-grid > .info-line:nth-child(2){ grid-column:3; grid-row:1; }
.sheet-header-grid > .info-line:nth-child(3){ grid-column:1; grid-row:2; }
.sheet-header-grid > .info-line:nth-child(4){ grid-column:3; grid-row:2; }
.sheet-header-grid > .info-line:nth-child(5){ grid-column:1; grid-row:3; }
.sheet-header-grid > .info-line:nth-child(6){ grid-column:3; grid-row:3; }
.sheet-header-grid > .info-line:nth-child(7){ grid-column:1; grid-row:4; }
.sheet-header-grid > .info-line:nth-child(8){ grid-column:3; grid-row:4; }
.info-line .lbl{ color:var(--soft-text-dim); white-space:nowrap; }
.info-line .val{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.name-score-table{
  grid-column:2;
  grid-row:1 / span 3;
  border-collapse:collapse;
  width:100%;
  height:100%;
}
.name-score-table td{
  border:1px solid var(--soft-border);
  text-align:center;
  padding:2px 4px;
}
.name-score-table .lr-tab{
  writing-mode:vertical-rl;
  font-size:11px;
  font-weight:700;
  color:var(--soft-text-dim);
  width:16px;
  background:var(--soft-card);
}
.name-score-table .name-box{
  font-weight:800;
  font-size:clamp(13px, 3.6vw, 16px);
  color:var(--soft-text);
  background:var(--soft-surface);
  width:34%;
}
.name-score-table .mini-score{
  color:var(--soft-text-dim);
  font-weight:600;
  font-size:12px;
}

/* ---------- 試合結果サマリー ---------- */

/* ---------- ゲームごとの得点グリッド（公式様式） ---------- */
.game-section{
  display:flex;
  border:1px solid var(--soft-border);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:10px;
}
.game-vlabel{
  writing-mode:vertical-rl;
  text-orientation:upright;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 4px;
  font-size:clamp(11px, 3vw, 13px);
  font-weight:700;
  color:var(--soft-text);
  background:var(--soft-card);
  border-right:1px solid var(--soft-border);
}
.game-section.empty .game-vlabel{ color:var(--soft-text-dim); }
.game-empty-note{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--soft-text-dim);
  font-size:13px;
  padding:10px;
}
.score-grid-wrap{
  flex:1;
  overflow-x:auto;
}
table.score-grid{
  border-collapse:collapse;
  height:100%;
}
table.score-grid td{
  border:1px solid var(--soft-border);
  text-align:center;
  vertical-align:middle;
  min-width:22px;
  padding:2px 1px;
  font-size:10px;
  color:var(--soft-text-dim);
}
table.score-grid td.lr-tab{
  writing-mode:vertical-rl;
  font-weight:700;
  min-width:14px;
  background:var(--soft-card);
  color:var(--soft-text-dim);
}
table.score-grid td.filled{
  background:var(--soft-primary);
  color:#fff;
  font-weight:800;
}
table.score-grid td.filled.team-b{
  background:var(--soft-secondary-dark);
}
table.score-grid td .lr-mark{
  display:block;
  font-size:8px;
  line-height:1;
  opacity:0.9;
}

.sign-row{
  display:flex;
  flex-wrap:wrap;
  gap:1vh 3vw;
  margin:2vh 0;
  font-size:min(2.4vw,1.8vh);
  color:var(--soft-text-dim);
}

.sheet-btns{
  display:flex;
  gap:2vw;
}
.sheet-btns button{
  flex:1;
  padding:1.6vh 0;
  border:none;
  border-radius:14px;
  font-size:min(3vw,2.2vh);
  font-weight:700;
}
.sheet-btns .print-btn{ background:var(--soft-surface); color:var(--soft-text); border:1px solid var(--soft-border); }
.sheet-btns .new-btn{ background:linear-gradient(135deg, var(--soft-primary), var(--soft-primary-dark)); color:#fff; }

@media print{
  body *{ visibility:hidden; }
  #sheetOverlay, #sheetOverlay *{ visibility:visible; }
  #sheetOverlay{ position:absolute; inset:0; background:#fff; color:#000; }
  .sheet{ background:#fff; color:#000; border:none; max-width:100%; }
  .sheet-result{ background:#f0f0f0; }
  .sheet-result .name.win{ color:#b8860b; }
  .sheet-btns{ display:none; }
  .info-line{ color:#000; border-bottom-color:#999; }
  .info-line .lbl{ color:#555; }
  .name-score-table td{ border-color:#333; }
  .name-score-table .name-box, .name-score-table .lr-tab{ background:#fff; color:#000; }
  .game-section{ border-color:#333; }
  .game-vlabel{ background:#fff; color:#000; border-right-color:#333; }
  .score-grid-wrap{ overflow:visible; }
  table.score-grid{ width:100%; table-layout:fixed; }
  table.score-grid td{ border-color:#333; color:#000; min-width:0; }
  table.score-grid td.lr-tab{ background:#fff; }
  table.score-grid td.filled{ background:#ddd !important; color:#000; font-weight:800; }
  .sign-row{ color:#000; }
}

.confirm-overlay{
  position:fixed; inset:0;
  background:rgba(92,74,58,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
}
.confirm-overlay.active{ display:flex; }
.confirm-box{
  background:var(--soft-bg);
  border:1px solid var(--soft-border);
  border-radius:20px;
  padding:3.5vh 4vw;
  max-width:92vw;
  text-align:center;
  color:var(--soft-text);
  box-shadow:0 12px 30px rgba(92,74,58,0.25);
}
.confirm-box p{ font-size:min(4.6vw,3.6vh); font-weight:600; line-height:1.5; margin:0 0 2.6vh; }
.confirm-box .row{ display:flex; gap:2vw; }
.confirm-box button{
  flex:1;
  padding:2vh 0;
  border:none;
  border-radius:14px;
  font-size:min(4vw,3.2vh);
  font-weight:800;
}
.confirm-box .cancel{ background:var(--soft-surface); color:var(--soft-text); border:1px solid var(--soft-border); }
.confirm-box .ok{ background:linear-gradient(135deg, var(--soft-danger), var(--soft-danger-dark)); color:#fff; }
</style>

</head>
<body>
<div id="app">

  <!-- 設定画面（縦画面のまま表示） -->
  <div id="settings">
    <h1 class="settings-title"><span class="shuttle">🏸</span>バドる - 試合設定</h1>

    <div class="field">
      <label>種目</label>
      <div class="seg" id="segType">
        <button data-v="singles" class="on">シングルス</button>
        <button data-v="doubles">ダブルス</button>
      </div>
    </div>

    <div class="field">
      <label>試合形式</label>
      <div class="seg" id="segFormat">
        <button data-v="single">1ゲームマッチ</button>
        <button data-v="best3" class="on">3ゲームマッチ</button>
      </div>
      <div class="hint">3ゲームマッチは2ゲーム先取で勝利。各ゲーム後にエンドを交代し、最終（3）ゲームは先に目標点の半分に達した側でエンドを交代します。</div>
    </div>

    <div class="field">
      <label>ゲームポイント</label>
      <div class="seg" id="segPoints">
        <button data-v="21" class="on">21点</button>
        <button data-v="15">15点</button>
        <button data-v="custom">入力</button>
      </div>
      <div class="custom-points-row" id="customPointsRow">
        <input type="number" id="customPoints" placeholder="目標点数を入力" min="3" max="99">
      </div>
    </div>

    <div class="field">
      <label>セッティング（デュース）</label>
      <div class="seg" id="segDeuce">
        <button data-v="on" class="on">あり</button>
        <button data-v="off">なし</button>
      </div>
      <div class="deuce-max-row show" id="deuceMaxRow">
        <label style="margin-top:0.8vh;">セッティング時の最大点</label>
        <input type="number" id="deuceMax" min="3" max="99">
        <div class="hint">例）21点なら30点、15点なら17点が一般的です</div>
      </div>
    </div>

    <div class="field">
      <label>選手名</label>
      <div class="two-col-swap">
        <div class="team-block">
          <div class="team-label">LEFT</div>
          <input type="text" id="nameA1" placeholder="選手1" value="選手A1">
          <input type="text" id="nameA2" placeholder="選手2（ダブルス）" value="選手A2">
        </div>
        <button type="button" id="swapSidesBtn" class="swap-btn" title="左右の選手名を入れ替え" aria-label="左右の選手名を入れ替え">⇄</button>
        <div class="team-block">
          <div class="team-label">RIGHT</div>
          <input type="text" id="nameB1" placeholder="選手1" value="選手B1">
          <input type="text" id="nameB2" placeholder="選手2（ダブルス）" value="選手B2">
        </div>
      </div>
      <div class="hint">LEFTが試合開始時に画面の左に表示されます。中央のボタンで入れ替えられます。</div>
    </div>

    <div class="field">
      <label>ファーストサーバー</label>
      <select id="firstServer"></select>
    </div>

    <div class="field">
      <label>ファーストレシーバー</label>
      <select id="firstReceiver"></select>
    </div>

    <div class="field">
      <label>大会情報（スコアシート用・任意入力）</label>
      <div class="two-col">
        <input type="text" id="tournamentName" placeholder="大会名">
        <input type="text" id="matchNumber" placeholder="試合番号">
      </div>
      <div class="two-col" style="margin-top:1vh;">
        <input type="text" id="venueName" placeholder="場所">
        <input type="text" id="courtNumber" placeholder="コート番号">
      </div>
    </div>

    <div class="err" id="settingsErr"></div>
    <button class="start-btn" id="startBtn">試合開始</button>

    <div class="past-matches" id="pastMatchesWrap" style="display:none;">
      <h3>過去の試合</h3>
      <div id="pastMatchesList"></div>
    </div>
  </div>

  <!-- スコアボード画面（横画面固定） -->
  <div class="rotor">
  <div id="board">
    <button class="gear-btn" id="gearBtn">⚙</button>
    <div class="game-target-badge" id="gameBadge"></div>
    <div class="set-status" id="setStatus"></div>
    <div class="board-main">
      <div class="side" id="sideLeft">
        <div class="score-zone"><div class="score-num" id="scoreLeftNum"></div></div>
        <div class="court-slots" id="slotsLeft"></div>
      </div>
      <div class="mid-divider"></div>
      <div class="side" id="sideRight">
        <div class="score-zone"><div class="score-num" id="scoreRightNum"></div></div>
        <div class="court-slots" id="slotsRight"></div>
      </div>
    </div>
    <div class="controls">
      <button class="undo-btn" id="undoBtn">元に戻す</button>
      <button class="change-btn" id="changeEndBtn">チェンジエンド</button>
      <button class="stop-btn" id="stopBtn">中止</button>
    </div>
  </div>

</div>
</div>

<!-- 次のゲームへ進むモーダル -->
<div class="confirm-overlay" id="nextGameOverlay">
  <div class="confirm-box">
    <p id="nextGameMsg"></p>
    <div class="row">
      <button class="ok" id="nextGameBtn" style="background:linear-gradient(135deg, var(--soft-primary), var(--soft-primary-dark)); color:#fff;">次のゲームへ</button>
    </div>
  </div>
</div>

<div id="toast" style="position:fixed; left:50%; bottom:12vh; transform:translateX(-50%) translateY(20px); background:var(--soft-surface); color:var(--soft-text); border:1px solid var(--soft-border); padding:1.4vh 3vw; border-radius:14px; font-size:min(2.8vw,2.2vh); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:70; white-space:nowrap; box-shadow:0 8px 20px rgba(92,74,58,0.25);"></div>

function otherTeam(t){ return t === 'A' ? 'B' : 'A'; }

function partnerOf(team, playerName){
  const arr = settings.players[team];
  if(arr.length < 2) return null;
  return arr[0] === playerName ? arr[1] : arr[0];
}

function teamOf(playerName){
  if(settings.players.A.includes(playerName)) return 'A';
  if(settings.players.B.includes(playerName)) return 'B';
  return null;
}

/* ---------- 設定画面 ---------- */

const segDeuce = document.getElementById('segDeuce');

const deuceMax = document.getElementById('deuceMax');

const firstReceiverSel = document.getElementById('firstReceiver');

let curFormat = 'best3';

let curDeuce = true;

function setSeg(container, value, onchange){
  [...container.children].forEach(btn=>{
    btn.classList.toggle('on', btn.dataset.v === String(value));
  });
}

  curType = btn.dataset.v;
  setSeg(segType, curType);

  nameA2.style.display = doubles ? 'block' : 'none';
  nameB2.style.display = doubles ? 'block' : 'none';
  refreshPlayerSelects();
});

segFormat.addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  curFormat = btn.dataset.v;
  setSeg(segFormat, curFormat);
});

segPoints.addEventListener('click', e=>{
  const btn = e.target.closest('button');

  customPointsRow.classList.toggle('show', btn.dataset.v === 'custom');
  if(btn.dataset.v === 'custom'){
    curPoints = 'custom';
  }else{
    curPoints = parseInt(btn.dataset.v, 10);
    deuceMax.value = curPoints === 15 ? 17 : 30;
  }
});

segDeuce.addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  curDeuce = btn.dataset.v === 'on';

function currentPlayers(){
  const a1 = document.getElementById('nameA1').value.trim() || '選手A1';
  const a2 = document.getElementById('nameA2').value.trim() || '選手A2';
  const b1 = document.getElementById('nameB1').value.trim() || '選手B1';
  const b2 = document.getElementById('nameB2').value.trim() || '選手B2';
  if(curType === 'singles'){
    return { A:[a1], B:[b1] };
  }
  return { A:[a1,a2], B:[b1,b2] };
}

function refreshPlayerSelects(){
  const players = currentPlayers();
  const sideLabel = { A:'LEFT', B:'RIGHT' };
  const all = [...players.A.map(n=>({n,t:'A'})), ...players.B.map(n=>({n,t:'B'}))];

  firstServerSel.innerHTML = all.map(p=>`<option value="${p.n}">${p.n}（${sideLabel[p.t]}）</option>`).join('');

  updateReceiverOptions();
}

function updateReceiverOptions(){
  const players = currentPlayers();
  const sideLabel = { A:'LEFT', B:'RIGHT' };
  const serverName = firstServerSel.value;
  const serverTeam = players.A.includes(serverName) ? 'A' : 'B';
  const recvTeam = serverTeam === 'A' ? 'B' : 'A';
  const opts = players[recvTeam];
  firstReceiverSel.innerHTML = opts.map(n=>`<option value="${n}">${n}（${sideLabel[recvTeam]}）</option>`).join('');
}

firstServerSel.addEventListener('change', updateReceiverOptions);
['nameA1','nameA2','nameB1','nameB2'].forEach(id=>{
  document.getElementById(id).addEventListener('input', refreshPlayerSelects);
});
document.getElementById('swapSidesBtn').addEventListener('click', ()=>{
  const a1 = document.getElementById('nameA1');

  const b2 = document.getElementById('nameB2');

});

document.getElementById('startBtn').addEventListener('click', ()=>{
  settingsErr.textContent = '';
  const players = currentPlayers();

  let target = curPoints;
  if(target === 'custom'){
    target = parseInt(customPoints.value, 10);
    if(!target || target < 3){
      settingsErr.textContent = '得点数を正しく入力してください';
      return;
    }
  }

  let dMax = curDeuce ? parseInt(deuceMax.value, 10) : target;
  if(curDeuce && (!dMax || dMax <= target)){
    settingsErr.textContent = 'セッティング時の最大点は目標点より大きい値を入力してください';
    return;
  }

  const firstServer = firstServerSel.value;
  const firstReceiver = firstReceiverSel.value;

  settings = {
    matchType: curType,
    matchFormat: curFormat,
    pointsTarget: target,
    deuce: curDeuce,
    deuceMax: dMax,
    players,
    firstServer,
    firstReceiver,
    initialLeftTeam: 'A',
    tournamentName: document.getElementById('tournamentName').value.trim(),
    matchNumber: document.getElementById('matchNumber').value.trim(),
    venueName: document.getElementById('venueName').value.trim(),
    courtNumber: document.getElementById('courtNumber').value.trim()
  };

  startNewMatch();
});

/* ---------- 試合状態の初期化 ---------- */
function startNewMatch(){
  match = {
    format: settings.matchFormat,
    gamesToWin: settings.matchFormat === 'best3' ? 2 : 1,
    games: [],
    gameWins: { A:0, B:0 },
    status: 'ongoing',
    overallWinner: null,
    startedAt: Date.now(),
    finishedAt: null
  };
  startGame(1, settings.initialLeftTeam, settings.firstServer, settings.firstReceiver);
}

function startGame(gameNumber, leftTeam, firstServerName, firstReceiverName){
  const serverTeam = teamOf(firstServerName);
  const receiverTeam = otherTeam(serverTeam);

  const positions = { A:{right:null,left:null}, B:{right:null,left:null} };

  if(settings.matchType === 'doubles'){
    const serverPartner = partnerOf(serverTeam, firstServerName);
    positions[serverTeam] = { right: firstServerName, left: serverPartner };
    const receiverPartner = partnerOf(receiverTeam, firstReceiverName);
    positions[receiverTeam] = { right: firstReceiverName, left: receiverPartner };
  }else{
    positions[serverTeam] = { right: firstServerName, left: firstServerName };
    positions[receiverTeam] = { right: firstReceiverName, left: firstReceiverName };
  }

  state = {
    gameNumber,
    rev: (state ? state.rev : 0) + 1,
    score: { A:0, B:0 },
    serverTeam,
    positions,
    leftTeam,
    pointLog: [],
    status: 'ongoing',
    winner: null,
    midGameEndsSwapped: false,
    startedAt: Date.now(),
    finishedAt: null
  };
  historyStack = [];

  showBoard();
  render();
  pushRemote();
}

/* ---------- 得点ロジック ---------- */
function snapshotState(){
  return JSON.parse(JSON.stringify(state));
}

function currentServerPlayer(){
  if(settings.matchType === 'singles'){
    return settings.players[state.serverTeam][0];
  }
  const box = (state.score[state.serverTeam] % 2 === 0) ? 'right' : 'left';
  return state.positions[state.serverTeam][box];
}

function serverBoxOf(team){
  return (state.score[team] % 2 === 0) ? 'right' : 'left';
}

function checkWinner(){
  const { A, B } = state.score;
  const target = settings.pointsTarget;
  const hi = Math.max(A,B), diff = Math.abs(A-B);
  if(settings.deuce){
    if(hi >= settings.deuceMax) return A > B ? 'A' : 'B';
    if(hi >= target && diff >= 2) return A > B ? 'A' : 'B';
    return null;
  }else{
    if(hi >= target) return A > B ? 'A' : 'B';
    return null;
  }
}

function awardPoint(winTeam){
  if(!state || state.status !== 'ongoing') return;
  historyStack.push(snapshotState());

  const prevServerTeam = state.serverTeam;
  const serverPlayerBefore = currentServerPlayer();

  if(winTeam === prevServerTeam){
    state.score[winTeam] += 1;
    if(settings.matchType === 'doubles'){
      const p = state.positions[winTeam];
      const tmp = p.right; p.right = p.left; p.left = tmp;
    }
  }else{
    state.serverTeam = winTeam;
    state.score[winTeam] += 1;
    // 受け取り側だったチーム(winTeam)のポジションはそのまま。サーバーは新しいスコアの奇偶で決まる
  }

  const newServerPlayer = currentServerPlayer();

  state.pointLog.push({
    seq: state.pointLog.length + 1,
    scoreA: state.score.A,
    scoreB: state.score.B,
    winTeam,
    serverTeamBefore: prevServerTeam,
    serverPlayerBefore,
    serverTeamAfter: state.serverTeam,
    serverPlayerAfter: newServerPlayer
  });

  // 最終ゲームでのエンドチェンジ（目標点の半分に先に到達した時点で1度だけ）
  if(match.format === 'best3' && state.gameNumber === 3 && !state.midGameEndsSwapped){
    const swapAt = Math.ceil(settings.pointsTarget / 2);
    if(state.score.A >= swapAt || state.score.B >= swapAt){
      state.leftTeam = otherTeam(state.leftTeam);
      state.midGameEndsSwapped = true;
      showToast(swapAt + '点でエンドチェンジしました');
    }
  }

  const w = checkWinner();
  if(w){
    finishGame(w);
  }

  state.rev += 1;
  render();
  pushRemote();
}

function finishGame(winTeam){
  state.status = 'finished';
  state.winner = winTeam;
  state.finishedAt = Date.now();

  match.games.push(snapshotState());
  match.gameWins[winTeam] += 1;

  if(match.gameWins[winTeam] >= match.gamesToWin){
    match.status = 'finished';
    match.overallWinner = winTeam;
    match.finishedAt = state.finishedAt;
    setTimeout(()=>openScoreSheet(), 250);
  }else{
    setTimeout(()=>openNextGamePrompt(winTeam), 250);
  }
}

function openNextGamePrompt(prevWinTeam){
  const nextGameNumber = state.gameNumber + 1;
  document.getElementById('nextGameMsg').innerHTML =
    `第${state.gameNumber}ゲーム終了<br><b style="font-size:1.15em;">${fmtTeamName('A')} ${state.score.A} - ${state.score.B} ${fmtTeamName('B')}</b><br>（ゲームカウント ${match.gameWins.A}-${match.gameWins.B}）`;
  document.getElementById('nextGameBtn').textContent = `第${nextGameNumber}ゲームへ進む`;
  pendingNextGame = { gameNumber: nextGameNumber, prevWinTeam };
  document.getElementById('nextGameOverlay').classList.add('active');
}

let pendingNextGame = null;
document.getElementById('nextGameBtn').addEventListener('click', ()=>{
  if(!pendingNextGame) return;
  const { gameNumber, prevWinTeam } = pendingNextGame;
  pendingNextGame = null;
  document.getElementById('nextGameOverlay').classList.remove('active');

  const newLeftTeam = otherTeam(state.leftTeam); // ゲームごとにエンドを交代
  const newFirstServer = settings.players[prevWinTeam][0]; // 前ゲームの勝者側が次ゲームの最初のサーバー
  const newFirstReceiver = settings.players[otherTeam(prevWinTeam)][0];
  startGame(gameNumber, newLeftTeam, newFirstServer, newFirstReceiver);
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>{
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2400);
}

function undoLast(){
  if(historyStack.length === 0) return;
  state = historyStack.pop();
  state.rev += 1;
  render();
  pushRemote();
}

function changeEnd(){
  if(!state) return;
  historyStack.push(snapshotState());
  state.leftTeam = otherTeam(state.leftTeam);
  state.rev += 1;
  render();
  pushRemote();
}

function abortMatch(){
  if(!state) return;
  state.status = 'aborted';
  state.finishedAt = Date.now();
  state.rev += 1;

  match.games.push(snapshotState());
  match.status = 'aborted';
  match.overallWinner = null;
  match.finishedAt = state.finishedAt;

  render();
  pushRemote();
  openScoreSheet();
}

const settingsEl = document.getElementById('settings');
const sideLeftEl = document.getElementById('sideLeft');
const sideRightEl = document.getElementById('sideRight');
const scoreLeftNum = document.getElementById('scoreLeftNum');
const scoreRightNum = document.getElementById('scoreRightNum');
const slotsLeft = document.getElementById('slotsLeft');
const slotsRight = document.getElementById('slotsRight');
const undoBtn = document.getElementById('undoBtn');

function showBoard(){
  settingsEl.classList.remove('active');
  boardEl.classList.add('active');
  boardEl.parentElement.classList.add('active'); // .rotor
}
function showSettings(){
  boardEl.classList.remove('active');
  boardEl.parentElement.classList.remove('active'); // .rotor
  settingsEl.classList.add('active');
  renderPastMatches();
}

function renderSlots(container, team){
  container.innerHTML = '';
  const serverTeam = state.serverTeam;
  const serverPlayer = currentServerPlayer();

  if(settings.matchType === 'singles'){
    // シングルスは両者ともサーバー側の得点の奇偶で立ち位置（右/左コート）が決まる
    const name = settings.players[team][0];
    const refBox = serverBoxOf(serverTeam);
    const isServer = team === serverTeam;
    const slot = document.createElement('div');
    slot.className = 'slot' + (isServer ? ' server' : '');
    slot.textContent = name;
    slot.style.marginLeft = refBox === 'right' ? 'auto' : '0';
    slot.style.marginRight = refBox === 'left' ? 'auto' : '0';
    container.appendChild(slot);
    return;
  }

  const pos = state.positions[team];
  ['right','left'].forEach(box=>{
    const name = pos[box];
    const slot = document.createElement('div');
    const isServer = (team === serverTeam) && (name === serverPlayer);
    slot.className = 'slot' + (isServer ? ' server' : '') + (name ? '' : ' empty');
    slot.textContent = name || '';
    container.appendChild(slot);
  });
}

function renderScoreCards(container, score, cardStyle){
  container.innerHTML = '';
  const digits = String(score).split('');
  digits.forEach(ch=>{
    const card = document.createElement('div');
    card.className = 'flip-card';
    if(cardStyle){
      card.style.height = cardStyle.height;
      card.style.width = cardStyle.width;
      card.style.fontSize = cardStyle.fontSize;
    }
    card.innerHTML = '<span class="ring l"></span><span class="ring r"></span><span class="digit">' + ch + '</span>';
    container.appendChild(card);
  });
}

function computeCardStyle(leftDigits, rightDigits){
  const zoneL = document.querySelector('#sideLeft .score-zone');
  const zoneR = document.querySelector('#sideRight .score-zone');
  if(!zoneL || !zoneR) return null;

  const minW = Math.min(zoneL.clientWidth, zoneR.clientWidth) * 0.94; // 左右クリアランス確保のため少し余裕を持たせる
  const minH = Math.min(zoneL.clientHeight, zoneR.clientHeight);
  if(minW <= 0 || minH <= 0) return null;

  const maxDigits = Math.max(1, leftDigits, rightDigits);
  const ASPECT = 0.68;   // width / height
  const GAP_RATIO = 0.09; // 桁間の隙間 = 高さ * この比率

  // maxDigits枚のカード + 隙間が横幅に収まる高さの上限
  const widthPerUnitHeight = (maxDigits * ASPECT) + ((maxDigits - 1) * GAP_RATIO);
  let h = minW / widthPerUnitHeight;
  h = Math.min(h, minH);
  h = Math.max(h, 24);

  const w = h * ASPECT;
  const gap = h * GAP_RATIO;

  return {
    height: h.toFixed(1) + 'px',
    width: w.toFixed(1) + 'px',
    fontSize: h.toFixed(1) + 'px',
    gap: gap.toFixed(1) + 'px'
  };
}

function render(){
  if(!state || !match) return;
  const leftTeam = state.leftTeam;
  const rightTeam = otherTeam(leftTeam);

  const leftScoreStr = String(state.score[leftTeam]);
  const rightScoreStr = String(state.score[rightTeam]);
  const cardStyle = computeCardStyle(leftScoreStr.length, rightScoreStr.length);

  scoreLeftNum.style.gap = cardStyle ? cardStyle.gap : '';
  scoreRightNum.style.gap = cardStyle ? cardStyle.gap : '';
  renderScoreCards(scoreLeftNum, state.score[leftTeam], cardStyle);
  renderScoreCards(scoreRightNum, state.score[rightTeam], cardStyle);

  sideLeftEl.classList.toggle('serving', state.serverTeam === leftTeam);
  sideRightEl.classList.toggle('serving', state.serverTeam === rightTeam);

  renderSlots(slotsLeft, leftTeam);
  renderSlots(slotsRight, rightTeam);

  undoBtn.disabled = historyStack.length === 0;

  const gameBadge = document.getElementById('gameBadge');
  const setStatus = document.getElementById('setStatus');
  if(gameBadge){
    gameBadge.textContent = `第${state.gameNumber}ゲーム　${settings.pointsTarget}点先取`;
  }
  if(setStatus){
    setStatus.textContent = match.format === 'best3'
      ? `ゲームカウント ${fmtTeamName('A')} ${match.gameWins.A} - ${match.gameWins.B} ${fmtTeamName('B')}`
      : '';
  }
}

/* ---------- タップ操作 ---------- */
sideLeftEl.addEventListener('click', ()=>{
  if(!state || state.status !== 'ongoing') return;
  awardPoint(state.leftTeam);
});
sideRightEl.addEventListener('click', ()=>{
  if(!state || state.status !== 'ongoing') return;
  awardPoint(otherTeam(state.leftTeam));
});

document.getElementById('undoBtn').addEventListener('click', undoLast);
document.getElementById('changeEndBtn').addEventListener('click', changeEnd);

document.getElementById('gearBtn').addEventListener('click', ()=>{

    openConfirm('設定画面に戻りますか？（現在の試合は中止されます）', ()=>{
      abortMatch();
    });
  }else{
    showSettings();
  }
});

document.getElementById('stopBtn').addEventListener('click', ()=>{

  });
});

/* ---------- スコアシート ---------- */
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetContent = document.getElementById('sheetContent');

function fmtTeamName(team){
  return settings.players[team].join(' / ');
}

function maxScoreForGrid(){
  return settings.deuce ? settings.deuceMax : settings.pointsTarget;
}

function scoreGridCellsHtml(game, team, n){
  const finalScore = game.score[team];
  let html = '';
  for(let k = 1; k <= n; k++){
    if(k <= finalScore){
      const box = (k % 2 === 0) ? 'R' : 'L';
      html += `<td class="filled${team === 'B' ? ' team-b' : ''}">${k}<span class="lr-mark">${box}</span></td>`;
    }else{
      html += `<td>${k}</td>`;
    }
  }
  return html;
}

function gameSectionHtml(gameIndexLabel, game, n){
  if(!game){
    return `
      <div class="game-section empty">
        <div class="game-vlabel">${gameIndexLabel}</div>
        <div class="game-empty-note">（未実施）</div>
      </div>
    `;
  }
  return `
    <div class="game-section">
      <div class="game-vlabel">${gameIndexLabel}</div>
      <div class="score-grid-wrap">
        <table class="score-grid">
          <tr>
            <td class="lr-tab" rowspan="2">L<br>・<br>R</td>
            ${scoreGridCellsHtml(game, 'A', n)}
            <td class="lr-tab" rowspan="2">L<br>・<br>R</td>
          </tr>
          <tr>
            ${scoreGridCellsHtml(game, 'B', n)}
          </tr>
        </table>
      </div>
    </div>
  `;
}

function openScoreSheet(){
  const allGames = match.games;
  const n = maxScoreForGrid();

  const startDt = new Date(match.startedAt);
  const finishDt = new Date(match.finishedAt || Date.now());
  const dateStr = startDt.toLocaleDateString('ja-JP');
  const startTimeStr = startDt.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });
  const endTimeStr = finishDt.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });

  const statusLabel = match.status === 'aborted' ? '（試合中止）' : '';
  const winnerName = match.overallWinner ? fmtTeamName(match.overallWinner) : null;
  const eventLabel = settings.matchType === 'doubles' ? 'ダブルス' : 'シングルス';

  const infoLine = (label, value)=> `<div class="info-line"><span class="lbl">${label}：</span><span class="val">${value || ''}</span></div>`;

  const gameSummaryRow = (g)=> g ? `<td class="mini-score">${g.score.A} － ${g.score.B}</td>` : `<td class="mini-score">－</td>`;

  const numGameSlots = match.format === 'best3' ? 3 : 1;
  const gameLabels = ['第一ゲーム', '第二ゲーム', '第三ゲーム'];
  const gamesHtml = Array.from({ length: numGameSlots }).map((_, i)=>
    gameSectionHtml(gameLabels[i], allGames[i] || null, n)
  ).join('');
  const summaryRowsHtml = Array.from({ length: numGameSlots }).map((_, i)=>
    `<tr>${gameSummaryRow(allGames[i])}</tr>`
  ).join('');

  sheetContent.innerHTML = `
    <h2 style="text-align:center;">ス　コ　ア　シ　ー　ト（得点用紙）${statusLabel}</h2>
    <div class="sheet-header-grid">
      ${infoLine('期日', dateStr)}
      ${infoLine('種目', eventLabel)}
      ${infoLine('大会名', settings.tournamentName)}
      ${infoLine('試合番号', settings.matchNumber)}
      ${infoLine('場所', settings.venueName)}
      ${infoLine('コート番号', settings.courtNumber)}
      ${infoLine('開始時間', startTimeStr)}
      ${infoLine('終了時間', endTimeStr)}
      <table class="name-score-table">
        <tr>
          <td class="lr-tab" rowspan="${numGameSlots}">L<br>・<br>R</td>
          <td class="name-box" rowspan="${numGameSlots}">${fmtTeamName('A')}</td>
          ${gameSummaryRow(allGames[0])}
          <td class="name-box" rowspan="${numGameSlots}">${fmtTeamName('B')}</td>
          <td class="lr-tab" rowspan="${numGameSlots}">L<br>・<br>R</td>
        </tr>
        ${numGameSlots > 1 ? `<tr>${gameSummaryRow(allGames[1])}</tr>` : ''}
        ${numGameSlots > 2 ? `<tr>${gameSummaryRow(allGames[2])}</tr>` : ''}
      </table>
    </div>

    <div class="sheet-result">
      <div class="name ${match.overallWinner==='A' ? 'win':''}">${fmtTeamName('A')}</div>
      <div class="final-score">${match.gameWins.A} - ${match.gameWins.B}</div>
      <div class="name ${match.overallWinner==='B' ? 'win':''}">${fmtTeamName('B')}</div>
    </div>
    ${winnerName ? `<div class="sub">勝者：${winnerName}</div>` : ''}

    ${gamesHtml}

    <div class="sign-row">
      <div class="sign-cell">勝者署名　＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
      <div class="sign-cell">主審署名　＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
      <div class="sign-cell">コール時間　${endTimeStr}</div>
    </div>
    <div class="sheet-btns">
      <button class="print-btn" id="printBtn">印刷 / PDF保存</button>
      <button class="new-btn" id="newMatchBtn">新しい試合へ</button>
    </div>
  `;

  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('newMatchBtn').addEventListener('click', ()=>{
    archiveMatch();
    sheetOverlay.classList.remove('active');
    showSettings();
  });

  sheetOverlay.classList.add('active');
}

function archiveMatch(){
  if(!dbReady || !matchesRef || !match) return;
  try{
    matchesRef.push({
      finishedAt: match.finishedAt || Date.now(),
      settings,
      gameWins: match.gameWins,
      overallWinner: match.overallWinner,
      status: match.status,
      games: match.games
    });
  }catch(e){ console.warn('archive失敗', e); }
}

/* ---------- 過去の試合一覧（設定画面） ---------- */
function renderPastMatches(){
  const wrap = document.getElementById('pastMatchesWrap');
  const list = document.getElementById('pastMatchesList');
  if(!dbReady || !matchesRef){ wrap.style.display = 'none'; return; }

  matchesRef.orderByChild('finishedAt').limitToLast(10).once('value').then(snap=>{
    const items = [];
    snap.forEach(child=>{ items.push({ id: child.key, ...child.val() }); });
    items.reverse();
    if(items.length === 0){ wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    list.innerHTML = items.map(m=>{
      const d = new Date(m.finishedAt);
      const names = `${m.settings.players.A.join('/')} vs ${m.settings.players.B.join('/')}`;
      const gw = m.gameWins || {A:0,B:0};
      return `<div class="past-row"><span>${d.toLocaleDateString('ja-JP')} ${names} ${gw.A}-${gw.B}</span></div>`;
    }).join('');
  }).catch(()=>{ wrap.style.display = 'none'; });
}

/* ---------- Firebase 同期 ---------- */
function pushRemote(){
  if(!dbReady || !matchRef) return;
  suppressRemote = true;
  matchRef.set({ deviceId: DEVICE_ID, settings, state, match }).catch(e=>console.warn('sync失敗', e));
  clearTimeout(remoteApplyTimer);
  remoteApplyTimer = setTimeout(()=>{ suppressRemote = false; }, 800);
}

if(dbReady){
  matchRef.on('value', snap=>{
    try{
      const val = snap.val();
      if(!val || !val.state || !val.match || !val.match.gameWins) return; // 旧形式データ等は無視
      if(val.match.status !== 'ongoing') return; // 終了・中止済みの試合は復元しない（開き直したら新規試合へ）
      if(val.deviceId === DEVICE_ID) return;
      if(suppressRemote) return;
      if(state && val.state.rev <= state.rev) return;

      settings = val.settings;
      state = val.state;
      match = val.match;
      historyStack = [];
      showBoard();
      render();
    }catch(e){
      console.warn('リモート同期データの反映に失敗しました（無視します）', e);
    }
  });
}

/* ---------- 画面向き変更時の再描画 ---------- */
window.addEventListener('resize', ()=>{ if(state) render(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(state) render(); }, 200); });

/* ---------- 初期表示 ---------- */
showSettings();
</script>
</body>
