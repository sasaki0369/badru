<style>
:root{
  --bg:#000000;
  --white:#ffffff;
  --yellow:#ffd400;
  --orange:#ff8c1a;
  --dim:#6b6b6b;
  --panel:#111214;
  --line:#2a2c30;
  --accent:#3b82f6;
  --danger:#e5484d;

  /* ---- 柔らかい配色（設定画面・ボタン・スコアシート用） ---- */
  --soft-bg:#fdf6ee;
  --soft-surface:#ffffff;
  --soft-card:#fffaf3;
  --soft-primary:#ffa374;
  --soft-primary-dark:#ec8552;
  --soft-secondary:#8fd0c3;
  --soft-secondary-dark:#5fb3a3;
  --soft-danger:#f2968a;
  --soft-danger-dark:#e17a6d;
  --soft-text:#5c4a3a;
  --soft-text-dim:#a6917e;
  --soft-border:#f0e2d0;
  --soft-shadow:0 6px 16px rgba(180,140,100,0.16);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:var(--bg); color:var(--white);
  font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
  overscroll-behavior:none;
  overflow:hidden;
}
#app{ position:fixed; inset:0; }

/* ---------- 横固定（縦持ち時は回転させて横画面として扱う） ---------- */
.rotor{
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  transform-origin:center center;
  display:none;
  pointer-events:none;
}
.rotor.active{
  display:block;
  pointer-events:auto;
}
@media (orientation:portrait){
  .rotor.active{
    width:100vh;
    height:100vw;
    top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(90deg);
  }
}

/* ---------- スコアボード画面 ---------- */
#board{
  position:relative;
  width:100%; height:100%;
  display:none;
  flex-direction:column;
  background:var(--bg);
}
#board.active{ display:flex; }

.board-main{
  flex:1;
  display:flex;
  min-height:0;
}
.side{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  position:relative;
  padding:1vh 3.2vw;
  min-width:0;
  min-height:0;
  border-right:1px solid #1a1a1a;
}
.side:last-child{ border-right:none; }
.side.serving{ background:rgba(255,212,0,0.05); }

.score-zone{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.score-num{
  display:flex;
  align-items:center;
  justify-content:center;
}
.plain-score-digits{
  font-family:"DIN Alternate","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  font-weight:900;
  font-variant-numeric:tabular-nums lining-nums;
  color:#f8f8f8;
  line-height:0.92;
  letter-spacing:-0.035em;
  text-shadow:0 2px 6px rgba(0,0,0,0.35);
}

/* ---------- フリップボード風スコアカード ---------- */
.flip-card{
  position:relative;
  height:min(38vh, 32vw);
  aspect-ratio:0.68;
  background:linear-gradient(180deg, #1e1e1e 0%, #131313 49%, #0c0c0c 51%, #060606 100%);
  border:1px solid #2e2e2e;
  border-radius:10px;
  box-shadow:0 10px 22px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.05);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.flip-card::before{
  content:'';
  position:absolute;
  left:5%; right:5%; top:50%;
  height:2px;
  background:rgba(0,0,0,0.55);
  box-shadow:0 1px 0 rgba(255,255,255,0.05);
}
.flip-card .ring{
  position:absolute;
  top:-6%;
  width:11%;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #d8d8d8, #7a7a7a 55%, #3a3a3a 100%);
  box-shadow:0 1px 2px rgba(0,0,0,0.7);
}
.flip-card .ring.l{ left:14%; }
.flip-card .ring.r{ right:14%; }
.flip-card .digit{
  font-size:0.68em;
  font-weight:900;
  line-height:1;
  color:var(--white);
  font-variant-numeric:tabular-nums;
  text-shadow:0 3px 0 rgba(0,0,0,0.55);
  -webkit-text-stroke:0.5px rgba(0,0,0,0.25);
  transform:translateY(-2%);
  transition:color .15s;
}
.side.serving .flip-card .digit{ color:var(--yellow); }
.flip-card:nth-child(1){ transform:rotate(-1.6deg); }
.flip-card:nth-child(2){ transform:rotate(1.2deg); }

.court-slots{
  flex:0 0 auto;
  display:flex;
  gap:3vw;
  margin-top:0.6vh;
  width:100%;
  justify-content:center;
}
.slot{
  flex:0 1 auto;
  min-width:0;
  max-width:46%;
  text-align:center;
  font-size:min(4.2vw, 4.6vh);
  font-weight:700;
  color:var(--white);
  padding:0.4vh 0.8vw;
  border-radius:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:opacity .15s;
}
.slot.empty{ visibility:hidden; }
.slot.server{ color:var(--orange); }
.slot.active-box{ box-shadow:inset 0 -3px 0 currentColor; }

.mid-divider{
  width:3px;
  align-self:stretch;
  margin:0 0.6vw;
  background:linear-gradient(to bottom, transparent, #444 12%, #444 88%, transparent);
}

.game-target-badge{
  position:absolute;
  top:1.2vh;
  left:1.5vw;
  transform:none;
  max-width:24%;
  font-size:min(2.6vw,2.4vh);
  color:var(--dim);
  letter-spacing:0.05em;
  white-space:nowrap;
}

.set-status{
  position:absolute;
  top:1.2vh;
  left:50%;
  right:auto;
  transform:translateX(-50%);
  max-width:48%;
  font-size:min(2.4vw,2.2vh);
  color:var(--dim);
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ---------- 下部ボタン行 ---------- */
.controls{
  display:flex;
  height:9vh;
  min-height:52px;
  border-top:1px solid #1c1c1c;
  background:#050505;
  gap:1.5vw;
  padding:0.8vh 1.5vw;
}
.controls button{
  flex:1;
  background:rgba(255,255,255,0.06);
  color:var(--white);
  border:none;
  border-radius:12px;
  font-size:min(3.4vw,2.4vh);
  font-weight:600;
  letter-spacing:0.05em;
}
.controls button:active{ background:rgba(255,255,255,0.14); }
.controls button.undo-btn{ color:var(--soft-text-dim); }
.controls button.change-btn{ color:var(--soft-secondary); }
.controls button.stop-btn{ color:var(--soft-danger); }
.controls button:disabled{ color:#3a3a3a; }

/* ---------- 設定画面（縦画面固定・柔らかい配色・大きめUI） ---------- */
#settings{
  position:relative;
  width:100%; height:100%;
  overflow-y:auto;
  background:var(--soft-bg);
  color:var(--soft-text);
  padding:28px 20px 48px;
  display:none;
}
#settings.active{ display:block; }
#settings > *{
  max-width:520px;
  margin-left:auto;
  margin-right:auto;
}
.settings-title{
  font-size:clamp(24px, 7vw, 30px);
  font-weight:800;
  margin:4px auto 22px;
  display:flex;
  align-items:center;
  gap:0.5em;
  color:var(--soft-text);
}
.settings-title .shuttle{ font-size:1.1em; }
.settings-title-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.settings-title-row .settings-title{ margin:4px 0 22px; }
.court-badge{
  font-weight:800;
  color:#fff;
  background:linear-gradient(135deg, var(--soft-primary), var(--soft-primary-dark));
  border-radius:999px;
  letter-spacing:0.03em;
  box-shadow:0 4px 10px rgba(0,0,0,0.25);
  z-index:20;
  white-space:nowrap;
}
.court-badge-settings{
  position:fixed;
  top:14px;
  right:14px;
  padding:8px 16px;
  font-size:clamp(14px, 4vw, 17px);
}
.court-badge-board{
  position:absolute;
  top:1vh;
  right:1.2vw;
  left:auto;
  transform:none;
  padding:0.65vh 1.7vw;
  font-size:min(3.4vw, 2.8vh);
  background:var(--yellow);
  color:#111;
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 4px 14px rgba(0,0,0,.55);
}
.help-btn{
  flex-shrink:0; width:34px; height:34px; border-radius:50%;
  background:var(--soft-surface); border:1.5px solid var(--soft-border);
  color:var(--soft-text-dim); font-size:16px; font-weight:800;
}
.help-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.help-modal-bg.active{display:flex}
.help-modal-box{background:var(--soft-surface,#fff);border-radius:18px;padding:22px;max-width:420px;width:100%;max-height:82vh;display:flex;flex-direction:column;color:var(--soft-text,#222)}
.help-modal-box h2{font-size:18px;font-weight:800;margin-bottom:14px}
.help-modal-scroll{overflow-y:auto;flex:1;padding-right:4px}
.help-modal-section{margin-bottom:16px}
.help-modal-section-title{font-size:14px;font-weight:700;margin-bottom:5px}
.help-modal-list{margin:0;padding-left:18px}
.help-modal-list li{font-size:12.5px;line-height:1.7;margin-bottom:4px;opacity:.85}
.help-modal-list b{opacity:1}
.help-modal-close{margin-top:14px;width:100%;padding:12px 0;border:none;border-radius:12px;background:var(--accent,#d63800);color:#fff;font-size:15px;font-weight:700}

/* 大会Now連携中は、選手名の左右入替・ファーストサーバー/レシーバー選択・試合開始以外を非表示にする */
#settings.taika-locked .field-type,
#settings.taika-locked .field-format,
#settings.taika-locked .field-points,
#settings.taika-locked .field-deuce,
#settings.taika-locked .field-tournament-info,
#settings.taika-locked .taika-link-inputs{
  display:none;
}
#settings.taika-locked .field-names input[type="text"]{
  background:var(--soft-surface-dim, #f0eee9);
  color:var(--soft-text-dim);
}

.field{
  margin-bottom:22px;
}
.field label{
  display:block;
  font-size:clamp(15px, 4.2vw, 17px);
  font-weight:600;
  color:var(--soft-text-dim);
  margin-bottom:10px;
  letter-spacing:0.02em;
}
.seg{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.seg button{
  flex:1;
  min-width:96px;
  min-height:52px;
  padding:14px 8px;
  background:var(--soft-surface);
  border:1.5px solid var(--soft-border);
  color:var(--soft-text);
  border-radius:14px;
  font-size:clamp(16px, 4.5vw, 19px);
  font-weight:700;
  box-shadow:var(--soft-shadow);
}
.seg button.on{
  background:var(--soft-primary);
  color:#fff;
  border-color:var(--soft-primary);
}
input[type="text"], input[type="number"]{
  width:100%;
  height:52px;
  min-height:52px;
  padding:12px 14px;
  background:var(--soft-surface);
  border:1.5px solid var(--soft-border);
  color:var(--soft-text);
  border-radius:12px;
  font-size:clamp(16px, 4.5vw, 19px);
  box-sizing:border-box;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{
  margin:0;
}
select{
  width:100%;
  min-height:52px;
  padding:12px 14px;
  background:var(--soft-surface);
  border:1.5px solid var(--soft-border);
  color:var(--soft-text);
  border-radius:12px;
  font-size:clamp(16px, 4.5vw, 19px);
}
.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.two-col-swap{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  align-items:center;
}
.swap-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--soft-surface);
  border:1.5px solid var(--soft-border);
  color:var(--soft-primary-dark);
  font-size:20px;
  font-weight:800;
  box-shadow:var(--soft-shadow);
}
.swap-btn:active{ background:var(--soft-primary); color:#fff; }
.team-block{
  background:var(--soft-card);
  border:1.5px solid var(--soft-border);
  border-radius:16px;
  padding:16px 14px;
  margin-bottom:12px;
  box-shadow:var(--soft-shadow);
}
.team-block .team-label{
  font-size:clamp(14px, 4vw, 16px);
  color:var(--soft-text-dim);
  margin-bottom:10px;
  font-weight:700;
}
.team-block input{ margin-bottom:10px; }
.team-block input:last-child{ margin-bottom:0; }

.deuce-max-row{ display:none; margin-top:14px; }
.deuce-max-row.show{ display:block; }
.custom-points-row{ display:none; margin-top:14px; }
.custom-points-row.show{ display:block; }

.start-btn{
  display:block;
  width:100%;
  min-height:60px;
  padding:18px 0;
  background:linear-gradient(135deg, var(--soft-primary), var(--soft-primary-dark));
  color:#fff;
  border:none;
  border-radius:16px;
  font-size:clamp(19px, 5.5vw, 23px);
  font-weight:800;
  margin:24px auto 0;
  box-shadow:var(--soft-shadow);
}
.start-btn:disabled{
  background:#e9ddd0;
  color:#b7a897;
  box-shadow:none;
}
.hint{
  font-size:clamp(13px, 3.6vw, 15px);
  color:var(--soft-text-dim);
  margin-top:8px;
  line-height:1.5;
}
.err{
  color:var(--soft-danger-dark);
  font-size:clamp(14px, 4vw, 16px);
  font-weight:600;
  margin-top:12px;
  min-height:1em;
}

.icon-shuttle{ display:inline-block; }

.past-matches{
  margin-top:32px;
  border-top:1.5px solid var(--soft-border);
  padding-top:20px;
}
.past-matches h3{
  font-size:clamp(16px, 4.5vw, 18px);
  color:var(--soft-text-dim);
  margin:0 0 12px;
  font-weight:700;
}
.past-row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--soft-border);
  font-size:clamp(14px, 4vw, 16px);
  color:var(--soft-text);
}
.past-row button{
  background:none;
  border:none;
  color:var(--soft-primary-dark);
  font-size:inherit;
  font-weight:600;
}

/* 設定を開く小ボタン（試合中） */
.gear-btn{
  position:absolute;
  top:1vh; left:1vw;
  width:8vw; height:8vw;
  max-width:44px; max-height:44px;
  min-width:32px; min-height:32px;
  background:rgba(255,255,255,0.06);
  border:none;
  border-radius:50%;
  color:var(--soft-text-dim);
  font-size:min(3vw,2.4vh);
  z-index:5;
}

/* ---------- スコアシート（モーダル・柔らかい配色） ---------- */
#sheetOverlay{
  position:fixed; inset:0;
  background:rgba(92,74,58,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:2vh 2vw;
}
#sheetOverlay.active{ display:flex; }
.sheet{
  background:var(--soft-bg);
  border:1px solid var(--soft-border);
  border-radius:20px;
  width:100%;
  max-width:640px;
  max-height:94vh;
  overflow-y:auto;
  padding:3vh 3vw;
  color:var(--soft-text);
  box-shadow:0 12px 30px rgba(92,74,58,0.25);
}
.sheet h2{
  margin:0 0 0.4vh;
  font-size:min(4vw,3vh);
  color:var(--soft-text);
}
.sheet .sub{
  color:var(--soft-text-dim);
  font-size:min(2.4vw,1.9vh);
  margin-bottom:2vh;
}
.sheet-result{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--soft-surface);
  border:1px solid var(--soft-border);
  border-radius:16px;
  padding:2vh 2vw;
  margin-bottom:2vh;
  box-shadow:var(--soft-shadow);
}
.sheet-result .name{ font-size:min(3vw,2.2vh); color:var(--soft-text); }
.sheet-result .name.win{ color:var(--soft-primary-dark); font-weight:800; }
.sheet-result .final-score{
  font-size:min(6vw,4.4vh);
  font-weight:800;
  color:var(--soft-text);
}
table.sheet-log{
  width:100%;
  border-collapse:collapse;
  font-size:min(2.4vw,1.8vh);
  margin-bottom:2vh;
}
table.sheet-log th, table.sheet-log td{
  border-bottom:1px solid var(--soft-border);
  padding:0.7vh 0.4vw;
  text-align:center;
}
table.sheet-log th{ color:var(--soft-text-dim); font-weight:600; }

/* ---------- 公式様式ヘッダー（期日・大会名等 ＋ 氏名登録表） ---------- */
.sheet-header-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(260px,2fr) minmax(0,1fr);
  grid-template-rows:repeat(4, auto);
  gap:4px 10px;
  margin-bottom:16px;
  font-size:clamp(12px, 3.2vw, 14px);
}
.info-line{
  display:flex;
  align-items:flex-end;
  gap:4px;
  border-bottom:1px dashed var(--soft-border);
  padding-bottom:3px;
  color:var(--soft-text);
  min-width:0; /* グリッド内でnowrapの値が列全体を押し広げてしまうのを防ぐ */
}
.sheet-header-grid > .info-line:nth-child(1){ grid-column:1; grid-row:1; }
.sheet-header-grid > .info-line:nth-child(2){ grid-column:3; grid-row:1; }
.sheet-header-grid > .info-line:nth-child(3){ grid-column:1; grid-row:2; }
.sheet-header-grid > .info-line:nth-child(4){ grid-column:3; grid-row:2; }
.sheet-header-grid > .info-line:nth-child(5){ grid-column:1; grid-row:3; }
.sheet-header-grid > .info-line:nth-child(6){ grid-column:3; grid-row:3; }
.sheet-header-grid > .info-line:nth-child(7){ grid-column:1; grid-row:4; }
.sheet-header-grid > .info-line:nth-child(8){ grid-column:3; grid-row:4; }
.info-line .lbl{ color:var(--soft-text-dim); white-space:nowrap; flex-shrink:0; }
.info-line .val{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
/* 大会名だけは省略せず2行まで折り返して表示する（長い大会名で中央の名前欄が圧迫されないように） */
.info-line.val-wrap .val{
  white-space:normal;
  overflow-wrap:anywhere;
  text-overflow:clip;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  line-height:1.25;
}

.name-score-table{
  grid-column:2;
  grid-row:1 / span 3;
  border-collapse:collapse;
  width:100%;
  height:100%;
}
.name-score-table td{
  border:1px solid var(--soft-border);
  text-align:center;
  padding:2px 4px;
}
.name-score-table .lr-tab{
  font-size:13px;
  font-weight:700;
  color:var(--soft-text-dim);
  width:16px;
  background:var(--soft-card);
}
.name-score-table .name-box{
  font-weight:800;
  font-size:clamp(13px, 3.6vw, 16px);
  line-height:1.4;
  color:var(--soft-text);
  background:var(--soft-surface);
  width:30%;
  min-width:6.4em; /* 日本語6文字までは改行されない幅の目安 */
}
.name-score-table .mini-score{
  color:var(--soft-text-dim);
  font-weight:600;
  font-size:12px;
  min-width:5.5ch; /* 「30 － 29」が改行されない幅の目安 */
  white-space:nowrap;
}
.name-score-table .game-count{
  font-weight:800;
  font-size:clamp(16px, 4.5vw, 20px);
  color:var(--soft-primary-dark);
  background:var(--soft-card);
  width:10%;
}

/* ---------- 試合結果サマリー ---------- */

/* ---------- ゲームごとの得点グリッド（公式様式） ---------- */
.game-section{
  display:flex;
  border:1px solid var(--soft-border);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:10px;
}
.game-vlabel{
  writing-mode:vertical-rl;
  text-orientation:upright;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 4px;
  font-size:clamp(11px, 3vw, 13px);
  font-weight:700;
  color:var(--soft-text);
  background:var(--soft-card);
  border-right:1px solid var(--soft-border);
}
.game-section.empty .game-vlabel{ color:var(--soft-text-dim); }
.game-empty-note{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--soft-text-dim);
  font-size:13px;
  padding:10px;
}
.score-grid-wrap{
  flex:1;
  overflow-x:auto;
}
table.score-grid{
  border-collapse:collapse;
  width:100%;
}
table.score-grid td{
  border:1px solid var(--soft-border);
  text-align:center;
  vertical-align:middle;
  min-width:15px;
  padding:2px 1px;
  font-size:10px;
  color:var(--soft-text-dim);
}
table.score-grid td.player-name{
  writing-mode:horizontal-tb;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:11px;
  font-weight:700;
  color:var(--soft-text);
  background:var(--soft-card);
  padding:2px 4px;
  min-width:100px;
  max-width:100px;
}

.sheet-player-name{display:block;line-height:1.2;}
.sheet-player-club{display:block;line-height:1.15;font-weight:600;color:var(--soft-text-dim);white-space:nowrap;overflow:hidden;text-align:left;margin-top:1px;}
.name-box .sheet-player-club{text-align:center;margin-top:2px;}
table.score-grid td.sr-mark{
  font-weight:800;
  min-width:11px;
  padding:2px 0;
  background:var(--soft-card);
  color:var(--soft-primary-dark);
}
table.score-grid td.filled{
  background:var(--soft-primary);
  color:#fff;
  font-weight:800;
}
table.score-grid td.filled.team-b{
  background:var(--soft-secondary-dark);
}

.sign-row{
  display:flex;
  flex-wrap:wrap;
  gap:1vh 3vw;
  margin:2vh 0;
  font-size:min(2.4vw,1.8vh);
  color:var(--soft-text-dim);
}

.sheet-btns{
  display:flex;
  gap:2vw;
}
.sheet-btns button{
  flex:1;
  padding:1.6vh 0;
  border:none;
  border-radius:14px;
  font-size:min(3vw,2.2vh);
  font-weight:700;
}
.sheet-btns .print-btn{ background:var(--soft-surface); color:var(--soft-text); border:1px solid var(--soft-border); }
.sheet-btns .new-btn{ background:linear-gradient(135deg, var(--soft-primary), var(--soft-primary-dark)); color:#fff; }

@page{
  size: A4 landscape;
  margin: 10mm;
}
@media print{
  body *{ visibility:hidden; }
  #sheetOverlay, #sheetOverlay *{ visibility:visible; }
  #sheetOverlay{ position:absolute; inset:0; background:#fff; color:#000; }
  .sheet{ background:#fff; color:#000; border:none; max-width:100%; }
  .sheet-result{ background:#f0f0f0; }
  .sheet-result .name.win{ color:#b8860b; }
  .sheet-btns{ display:none; }
  .info-line{ color:#000; border-bottom-color:#999; }
  .info-line .lbl{ color:#555; }
  .name-score-table td{ border-color:#333; }
  .name-score-table .name-box, .name-score-table .lr-tab{ background:#fff; color:#000; }
  .name-score-table .game-count{ background:#fff; color:#000; }
  .game-section{ border-color:#333; }
  .game-vlabel{ background:#fff; color:#000; border-right-color:#333; }
  .score-grid-wrap{ overflow:visible; }
  table.score-grid{ width:100%; table-layout:fixed; }
  table.score-grid td{ border-color:#333; color:#000; }
  table.score-grid td:not(.player-name):not(.sr-mark){ min-width:0; width:auto; }
  table.score-grid td.player-name{ width:100px; min-width:100px; max-width:100px; background:#fff; }
  table.score-grid td.sr-mark{ width:11px; min-width:11px; background:#fff; }
  table.score-grid td.filled{ background:#ddd !important; color:#000; font-weight:800; }
  .sign-row{ color:#000; }
}

.confirm-overlay{
  position:fixed; inset:0;
  background:rgba(92,74,58,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
}
.confirm-overlay.active{ display:flex; }
.confirm-box{
  background:var(--soft-bg);
  border:1px solid var(--soft-border);
  border-radius:20px;
  padding:3.5vh 4vw;
  max-width:92vw;
  text-align:center;
  color:var(--soft-text);
  box-shadow:0 12px 30px rgba(92,74,58,0.25);
}
.confirm-box p{ font-size:min(4.6vw,3.6vh); font-weight:600; line-height:1.5; margin:0 0 2.6vh; }
.confirm-box .row{ display:flex; gap:2vw; }
.confirm-box button{
  flex:1;
  padding:2vh 0;
  border:none;
  border-radius:14px;
  font-size:min(4vw,3.2vh);
  font-weight:800;
}
.confirm-box .cancel{ background:var(--soft-surface); color:var(--soft-text); border:1px solid var(--soft-border); }
.confirm-box .ok{ background:linear-gradient(135deg, var(--soft-danger), var(--soft-danger-dark)); color:#fff; }

/* 棄権選択：長い選手名でもボタン内に十分な左右余白を確保 */
#retireOverlay .confirm-box{
  width:min(96vw, 760px);
  max-width:96vw;
  padding:3.5vh clamp(22px, 5vw, 44px);
  box-sizing:border-box;
}
#retireOverlay .row{ width:100%; }
#retireOverlay button{
  width:100% !important;
  box-sizing:border-box;
  padding:2vh clamp(24px, 6vw, 52px);
  font-size:clamp(20px, 3.6vw, 32px);
  line-height:1.35;
  white-space:normal;
  overflow-wrap:anywhere;
}

/* 大会Nowから受信した所属チーム：選手名を主役にし、所属は控えめな補助情報として表示 */
.player-club{font-size:clamp(11px,2.2vw,15px);color:var(--soft-text-dim);font-weight:600;line-height:1.25;margin:-.15vh .35vw .75vh;min-height:1.25em;letter-spacing:.01em;}
.player-club:empty{display:none;}
</style>

</head>
<body>
<div id="app">

  <!-- 設定画面（縦画面のまま表示） -->
  <div id="settings">
    <div class="court-badge court-badge-settings" id="courtBadgeSettings" style="display:none;"></div>
    <div class="settings-title-row">
      <h1 class="settings-title"><span class="shuttle">🏸</span>バドる - 試合設定</h1>
      <button type="button" id="helpBtn" class="help-btn">?</button>
    </div>

    <div class="field field-type">
      <label>種目</label>
      <div class="seg" id="segType">
        <button data-v="singles">シングルス</button>
        <button data-v="doubles" class="on">ダブルス</button>
      </div>
    </div>

    <div class="field field-format">
      <label>試合形式</label>
      <div class="seg" id="segFormat">
        <button data-v="single">1ゲームマッチ</button>
        <button data-v="best3" class="on">3ゲームマッチ</button>
      </div>
      <div class="hint">3ゲームマッチは2ゲーム先取で勝利。各ゲーム後にエンドを交代し、最終（3）ゲームは先に目標点の半分に達した側でエンドを交代します。</div>
    </div>

    <div class="field field-points">
      <label>ゲームポイント</label>
      <div class="seg" id="segPoints">
        <button data-v="21">21点</button>
        <button data-v="15" class="on">15点</button>
        <button data-v="custom">入力</button>
      </div>
      <div class="custom-points-row" id="customPointsRow">
        <input type="number" id="customPoints" placeholder="目標点数を入力" min="3" max="99">
      </div>
    </div>

    <div class="field field-deuce">
      <label>セッティング（デュース）</label>
      <div class="seg" id="segDeuce">
        <button data-v="on" class="on">あり</button>
        <button data-v="off">なし</button>
      </div>
      <div class="deuce-max-row show" id="deuceMaxRow">
        <label style="margin-top:0.8vh;">セッティング時の最大点</label>
        <input type="number" id="deuceMax" min="3" max="99">
        <div class="hint">例）15点なら21点、21点なら30点が一般的です</div>
      </div>
    </div>

    <div class="field field-names">
      <label>選手名</label>
      <div class="two-col-swap">
        <div class="team-block">
          <div class="team-label">LEFT</div>
          <input type="text" id="nameA1" placeholder="選手1" value="選手A1">
          <div class="player-club" id="clubA1"></div>
          <input type="text" id="nameA2" placeholder="選手2（ダブルス）" value="選手A2">
          <div class="player-club" id="clubA2"></div>
        </div>
        <button type="button" id="swapSidesBtn" class="swap-btn" title="左右の選手名を入れ替え" aria-label="左右の選手名を入れ替え">⇄</button>
        <div class="team-block">
          <div class="team-label">RIGHT</div>
          <input type="text" id="nameB1" placeholder="選手1" value="選手B1">
          <div class="player-club" id="clubB1"></div>
          <input type="text" id="nameB2" placeholder="選手2（ダブルス）" value="選手B2">
          <div class="player-club" id="clubB2"></div>
        </div>
      </div>
      <div class="hint">LEFTが試合開始時に画面の左に表示されます。中央のボタンで入れ替えられます。</div>
    </div>

    <div class="field field-first-server">
      <label>ファーストサーバー</label>
      <select id="firstServer"></select>
    </div>

    <div class="field field-first-receiver">
      <label>ファーストレシーバー</label>
      <select id="firstReceiver"></select>
    </div>

    <div class="field field-tournament-info">
      <label>大会情報（スコアシート用・任意入力）</label>
      <div class="two-col">
        <input type="text" id="tournamentName" placeholder="大会名">
        <input type="text" id="matchNumber" placeholder="試合番号">
      </div>
      <div class="two-col" style="margin-top:1vh;">
        <input type="text" id="venueName" placeholder="場所">
        <input type="text" id="courtNumber" placeholder="コート番号">
      </div>
    </div>

    <div class="field field-taika-link">
      <label>大会Now連携</label>
      <div class="team-block taika-link-inputs">
        <div class="two-col">
          <input type="text" id="taikaEventId" placeholder="大会ID">
          <input type="number" id="taikaCourtNo" placeholder="コート番号" min="1">
        </div>
        <div class="seg" id="segTaikaLink" style="margin-top:1vh;">
          <button type="button" data-v="off" class="on">連携しない</button>
          <button type="button" data-v="on">連携する</button>
        </div>
      </div>
      <div class="hint" id="taikaStatusHint">連携すると、大会Nowから配信された次の試合が自動的に反映されます。</div>
    </div>

    <div class="err" id="settingsErr"></div>
    <button class="start-btn" id="startBtn">試合開始</button>

    <div class="past-matches" id="pastMatchesWrap" style="display:none;">
      <h3>過去の試合</h3>
      <div id="pastMatchesList"></div>
    </div>
  </div>

  <!-- スコアボード画面（横画面固定） -->
  <div class="rotor">
  <div id="board">
    <div class="court-badge court-badge-board" id="courtBadgeBoard" style="display:none;"></div>
    <div class="game-target-badge" id="gameBadge"></div>
    <div class="set-status" id="setStatus"></div>
    <div class="board-main">
      <div class="side" id="sideLeft">
        <div class="score-zone"><div class="score-num" id="scoreLeftNum"></div></div>
        <div class="court-slots" id="slotsLeft"></div>
      </div>
      <div class="mid-divider"></div>
      <div class="side" id="sideRight">
        <div class="score-zone"><div class="score-num" id="scoreRightNum"></div></div>
        <div class="court-slots" id="slotsRight"></div>
      </div>
    </div>
    <div class="controls">
      <button class="undo-btn" id="undoBtn">Undo</button>
      <button class="change-btn" id="changeEndBtn">チェンジエンド</button>
      <button class="stop-btn" id="retireBtn">棄権</button>
      <button class="stop-btn" id="stopBtn">中止</button>
    </div>
  </div>

</div>
</div>

<!-- 棄権：どちら側が棄権するか選択するモーダル -->
<div class="confirm-overlay" id="retireOverlay">
  <div class="confirm-box">

function setCourtReadOnly(readOnly, owner){
  courtLockOwned = !readOnly;
  courtLockOwner = owner || null;

  if(!dbReady || !db || !taikaLink || !taikaLink.enabled || !taikaLink.eventId || !taikaLink.courtNo) return null;
  return db.ref('taikainow/' + taikaLink.eventId + '/courtLocks/' + taikaLink.courtNo);

function stopCourtLock(){
  if(courtLockHeartbeat){ clearInterval(courtLockHeartbeat); courtLockHeartbeat=null; }
  if(courtLockRef){ try{ courtLockRef.off('value'); }catch(e){} }
  courtLockRef=null; courtLockOwned=false; courtLockOwner=null;
  const ov=document.getElementById('courtLockOverlay'); if(ov) ov.style.display='none';
  const badge=document.getElementById('spectatorBadge'); if(badge) badge.style.display='none';
}
function startCourtLock(){
  stopCourtLock();
  const ref = courtLockPathRef();
  if(!ref) return;
  courtLockRef = ref;
  const now = Date.now();
  ref.transaction(cur=>{
    if(!cur || cur.deviceId===DEVICE_ID || !cur.heartbeatAt || now-cur.heartbeatAt>COURT_LOCK_STALE_MS){
      return {deviceId:DEVICE_ID, acquiredAt:(cur&&cur.deviceId===DEVICE_ID&&cur.acquiredAt)||now, heartbeatAt:now};
    }
    return;
  }, (err, committed, snap)=>{
    if(err) return;
    const val=snap&&snap.val();
    setCourtReadOnly(!(committed && val && val.deviceId===DEVICE_ID), val);
    if(committed && val && val.deviceId===DEVICE_ID){
      try{ ref.onDisconnect().remove(); }catch(e){}
    }
  });
  ref.on('value', snap=>{
    const val=snap.val();
    const stale = val && val.heartbeatAt && Date.now()-val.heartbeatAt>COURT_LOCK_STALE_MS;
    if(!val || stale){
      if(!courtLockOwned) startCourtLock();
      return;
    }
    setCourtReadOnly(val.deviceId!==DEVICE_ID, val);
  });
  courtLockHeartbeat=setInterval(()=>{
    if(courtLockOwned && courtLockRef){ courtLockRef.update({heartbeatAt:Date.now()}).catch(()=>{}); }
  },10000);
}
function takeOverCourtLock(){
  const ref=courtLockPathRef(); if(!ref) return;
  const now=Date.now();
  ref.set({deviceId:DEVICE_ID, acquiredAt:now, heartbeatAt:now}).then(()=>{
    try{ ref.onDisconnect().remove(); }catch(e){}
    setCourtReadOnly(false, {deviceId:DEVICE_ID});
  }).catch(()=>{});
}
function hasCourtOperationRight(){

   リーグ・ブラケットの解決は行わず、「同じ選手が同時に複数コートへ出ない」ことだけを守って
   キューの先頭から空いたコートへ割り当てる。大会Now側のcomputeDispatch内のassignIdleCourtsと同じ考え方。 */
function liteTimeToMinutes(t){
  if(!t) return null;
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t).trim());
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function liteAssignIdleCourts(data){
  const courtCount = data.courtCount || 0;
  const queue = (data.queue || []).slice();
  const courts = Object.assign({}, data.courts || {});
  let changed = false;
  const playing = {};
  Object.keys(courts).forEach(cno=>{
    const c = courts[cno];
    if(c && c.match && (c.status==='assigned' || c.status==='live')){
      (c.match.teamA||[]).concat(c.match.teamB||[]).forEach(n=>{ if(n) playing[n]=true; });
    }
  });
  // 大会Now本体のassignIdleCourtsと同じく、格納順ではなく「予測時刻の早い順」で候補を探す
  function sortedView(){
    return queue.slice().sort((a,b)=>{
      const ma=liteTimeToMinutes(a.time), mb=liteTimeToMinutes(b.time);
      if(ma===null && mb===null) return 0;
      if(ma===null) return 1;
      if(mb===null) return -1;
      return ma-mb;
    });
  }
  for(let i=1;i<=courtCount;i++){
    const key = String(i);
    const court = courts[key] || {status:'idle', match:null, live:null, lastResult:null};
    if(court.status !== 'idle' || queue.length===0) continue;
    const view = sortedView();
    let picked = null;
    for(let qi=0; qi<view.length; qi++){
      const names = (view[qi].teamA||[]).concat(view[qi].teamB||[]);
      const conflict = names.some(n=> n && playing[n]);
      if(!conflict){ picked = view[qi]; break; }
    }
    if(!picked) continue;
    const idx = queue.indexOf(picked);
    if(idx === -1) continue;
    queue.splice(idx,1);
    courts[key] = Object.assign({}, court, {status:'assigned', match:picked, live:null, assignedAt: Date.now()});
    changed = true;
    (picked.teamA||[]).concat(picked.teamB||[]).forEach(n=>{ if(n) playing[n]=true; });
  }
  if(!changed) return data;
  return Object.assign({}, data, {queue, courts});
}
function watchTaikaEventForLiteDispatch(){
  if(!dbReady || !db || !taikaLink || !taikaLink.enabled || !taikaLink.eventId) return;
  const ref = db.ref('taikainow/' + taikaLink.eventId);
  taikaEventListenerRef = ref;
  ref.on('value', snap=>{
    const data = snap.val();
    if(!data) return;
    taikaEventDataCache = data;
    // 既にコートの試合を読み込んだ後で大会全体データが届いた場合も、所属を補完して再描画する

}

  stopTaikaListener();
  const ref = taikaCourtRef();
  if(!ref) return;
  taikaCourtListenerRef = ref;
  ref.on('value', snap=>{
    const data = snap.val();
    taikaCourtData = data;
    renderTaikaStatusHint(data);
    // 試合中でない時に、新しく配信された試合があれば自動反映する
    // （結果送信→次の配信が同期的に連続することがあるため、設定画面の表示有無では判定しない）
    if(state && state.status === 'ongoing') return;
    // 「配信済み」だけでなく「進行中」のコートを後から開いた場合も、
    // 大会Now側の現在試合を設定画面へ復元する。
    // これにより大会Nowのコートリンクからバドるを開き直しても選手名が空欄にならない。
    if(data && (data.status === 'assigned' || data.status === 'live') && data.match){
      const matchId = data.match.id || (data.match.matchCode + '_' + JSON.stringify(data.match.teamA));
      if(matchId !== lastTaikaMatchId){
        lastTaikaMatchId = matchId;
        applyTaikaMatchToForm(data.match);
      }
    }
  });
  const rulesRef = taikaEventRulesRef();
  if(rulesRef){
    taikaRulesListenerRef = rulesRef;
    rulesRef.on('value', snap=>{
      if(state && state.status === 'ongoing') return; // 試合中は上書きしない
      applyTaikaRulesToForm(snap.val());
    });
  }
  watchTaikaEventForLiteDispatch();
}

function calcOfficialRetirementPoints(){
  // 棄権時の公式スコア：実際に取得済みの得点は残し、未取得分は勝者側が取得したものとして補完する。
  // 例 21-18, 17-10でA棄権 → 21-18, 17-21, 0-21（21点制の場合）
  if(!match || !match.retired) return null;
  const winner = match.retiredSide === 'A' ? 'B' : 'A';
  const target = Number(settings.pointsTarget) || 21;
  const gamesToWin = match.gamesToWin || 1;
  const games = (match.games || []).map(g=>({A:Number(g.score.A)||0, B:Number(g.score.B)||0}));
  if(games.length){
    const last = games[games.length-1];
    // 棄権が発生したゲームは、勝者がそのゲームの目標点まで取得したものとする。
    if(last[winner] < target) last[winner] = target;
  }
  let winnerGames = games.filter(g=>g[winner] > g[otherTeam(winner)]).length;
  while(winnerGames < gamesToWin){
    const g={A:0,B:0}; g[winner]=target; games.push(g); winnerGames++;
  }
  return {
    games,
    pointsA: games.reduce((sum,g)=>sum+g.A,0),
    pointsB: games.reduce((sum,g)=>sum+g.B,0)
  };
}

function notifyTaikaMatchFinished(result){
  const ref = taikaCourtRef();
  if(!ref) return;
  lastTaikaMatchId = null;
  const retirementOfficial = calcOfficialRetirementPoints();
  const pointsA = retirementOfficial ? retirementOfficial.pointsA : ((match && match.games) ? match.games.reduce((s,g)=>s+g.score.A, 0) : 0);
  const pointsB = retirementOfficial ? retirementOfficial.pointsB : ((match && match.games) ? match.games.reduce((s,g)=>s+g.score.B, 0) : 0);
  const assignedMatch = (taikaCourtData && taikaCourtData.match) ? taikaCourtData.match : null;
  const refInfo = assignedMatch
    ? { refType: assignedMatch.refType || null, refId: assignedMatch.refId || null, refMatchIndex: (assignedMatch.refMatchIndex !== undefined ? assignedMatch.refMatchIndex : null) }
    : { refType: null, refId: null, refMatchIndex: null };
  const payload = Object.assign({ pointsA, pointsB, officialGames: retirementOfficial ? retirementOfficial.games : null }, result, refInfo);
  ref.update({ status:'idle', match:null, live:null, lastResult: payload, updatedAt: Date.now() }).catch(()=>{});
}

/* ---------- 試合状態の初期化 ---------- */
function startNewMatch(){
  match = {
    format: settings.matchFormat,
    gamesToWin: settings.matchFormat === 'best3' ? 2 : 1,
    games: [],
    gameWins: { A:0, B:0 },
    status: 'ongoing',
    overallWinner: null,
    startedAt: Date.now(),
    finishedAt: null
  };
  startGame(1, settings.initialLeftTeam, settings.firstServer, settings.firstReceiver);
}

function startGame(gameNumber, leftTeam, firstServerName, firstReceiverName){
  const serverTeam = teamOf(firstServerName) || 'A'; // 万一名前が一致しない場合でもクラッシュしないようフォールバック
  const receiverTeam = otherTeam(serverTeam);

  const positions = { A:{right:null,left:null}, B:{right:null,left:null} };

  if(settings.matchType === 'doubles'){
    const serverPartner = partnerOf(serverTeam, firstServerName);
    positions[serverTeam] = { right: firstServerName, left: serverPartner };
    const receiverPartner = partnerOf(receiverTeam, firstReceiverName);
    positions[receiverTeam] = { right: firstReceiverName, left: receiverPartner };
  }else{
    positions[serverTeam] = { right: firstServerName, left: firstServerName };
    positions[receiverTeam] = { right: firstReceiverName, left: firstReceiverName };
  }

  state = {
    gameNumber,
    rev: (state ? state.rev : 0) + 1,
    score: { A:0, B:0 },
    serverTeam,
    positions,
    leftTeam,
    pointLog: [],
    status: 'ongoing',
    winner: null,
    midGameEndsSwapped: false,
    initialServer: firstServerName,
    initialReceiver: firstReceiverName,
    startedAt: Date.now(),
    finishedAt: null
  };
  historyStack = [];

  showBoard();
  render();
  pushRemote();
}

/* ---------- 得点ロジック ---------- */
function snapshotState(){
  return JSON.parse(JSON.stringify(state));
}

function currentServerPlayer(){
  if(settings.matchType === 'singles'){
    return settings.players[state.serverTeam][0];
  }
  const box = (state.score[state.serverTeam] % 2 === 0) ? 'right' : 'left';
  return state.positions[state.serverTeam][box];
}

function serverBoxOf(team){
  return (state.score[team] % 2 === 0) ? 'right' : 'left';
}

function checkWinner(){
  const { A, B } = state.score;
  const target = settings.pointsTarget;
  const hi = Math.max(A,B), diff = Math.abs(A-B);
  if(settings.deuce){
    if(hi >= settings.deuceMax) return A > B ? 'A' : 'B';
    if(hi >= target && diff >= 2) return A > B ? 'A' : 'B';
    return null;
  }else{
    if(hi >= target) return A > B ? 'A' : 'B';
    return null;
  }
}

function awardPoint(winTeam){
  if(!state || state.status !== 'ongoing') return;
  historyStack.push(snapshotState());

  const prevServerTeam = state.serverTeam;
  const serverPlayerBefore = currentServerPlayer();

  if(winTeam === prevServerTeam){
    state.score[winTeam] += 1;
    if(settings.matchType === 'doubles'){
      const p = state.positions[winTeam];
      const tmp = p.right; p.right = p.left; p.left = tmp;
    }
  }else{
    state.serverTeam = winTeam;
    state.score[winTeam] += 1;
    // 受け取り側だったチーム(winTeam)のポジションはそのまま。サーバーは新しいスコアの奇偶で決まる
  }

  const newServerPlayer = currentServerPlayer();

  state.pointLog.push({
    seq: state.pointLog.length + 1,
    scoreA: state.score.A,
    scoreB: state.score.B,
    winTeam,
    serverTeamBefore: prevServerTeam,
    serverPlayerBefore,
    serverTeamAfter: state.serverTeam,
    serverPlayerAfter: newServerPlayer
  });

  // 最終ゲームでのエンドチェンジ（目標点の半分に先に到達した時点で1度だけ）
  if(match.format === 'best3' && state.gameNumber === 3 && !state.midGameEndsSwapped){
    const swapAt = Math.ceil(settings.pointsTarget / 2);
    if(state.score.A >= swapAt || state.score.B >= swapAt){
      state.leftTeam = otherTeam(state.leftTeam);
      state.midGameEndsSwapped = true;
      showToast(swapAt + '点でエンドチェンジしました');
    }
  }

  const w = checkWinner();
  if(w){
    finishGame(w);
  }

  state.rev += 1;
  render();
  pushRemote();
}

let pendingFinishTimer = null;

function finishGame(winTeam){
  state.status = 'finished';
  state.winner = winTeam;
  state.finishedAt = Date.now();

  match.games.push(snapshotState());
  match.gameWins[winTeam] += 1;

  if(match.gameWins[winTeam] >= match.gamesToWin){
    match.status = 'finished';
    match.overallWinner = winTeam;
    match.finishedAt = state.finishedAt;
    pendingFinishTimer = setTimeout(()=>{ pendingFinishTimer = null; openScoreSheet(); }, 250);
  }else{
    pendingFinishTimer = setTimeout(()=>{ pendingFinishTimer = null; openNextGamePrompt(winTeam); }, 250);
  }
}

    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';

}

function undoLast(){
  if(historyStack.length === 0) return;
  const wasFinishing = state.status !== 'ongoing';
  state = historyStack.pop();
  state.rev += 1;

  if(wasFinishing){
    // 直前の得点でゲーム／試合が終了していた場合は、match側の記録（ゲーム結果・
    // ゲームカウント・試合終了状態）も一緒に巻き戻す。盤面の通常Undoボタンでも
    // 次の画面（次ゲームへ進む／スコアシート）のUndoボタンでも、同じ経路で
    // 安全に巻き戻せるようにするための共通処理。
    if(pendingFinishTimer){
      clearTimeout(pendingFinishTimer);
      pendingFinishTimer = null;
    }
    if(match.games.length > 0){
      const lastGame = match.games[match.games.length - 1];
      if(lastGame.gameNumber === state.gameNumber){
        match.games.pop();
        const w = lastGame.winner;
        if(w && match.gameWins[w] > 0){
          match.gameWins[w] -= 1;
        }
      }
    }
    match.status = 'ongoing';
    match.overallWinner = null;
    match.finishedAt = null;
  }

  render();
  pushRemote();
}

function changeEnd(){
  if(!state) return;
  historyStack.push(snapshotState());
  state.leftTeam = otherTeam(state.leftTeam);
  state.rev += 1;
  render();
  pushRemote();
}

function abortMatch(){
  if(!state || state.status !== 'ongoing') return;
  state.status = 'aborted';
  state.finishedAt = Date.now();
  state.rev += 1;

  match.games.push(snapshotState());
  match.status = 'aborted';
  match.overallWinner = null;
  match.finishedAt = state.finishedAt;

  clearActiveMatchLocal();
  render();
  pushRemote();
  openScoreSheet();
}

function retireMatch(retiredSide){
  if(!state || state.status !== 'ongoing') return;
  const winnerSide = retiredSide === 'A' ? 'B' : 'A';
  state.status = 'finished';
  state.winner = winnerSide;
  state.finishedAt = Date.now();
  state.rev += 1;

  match.games.push(snapshotState());
  match.gameWins[winnerSide] = match.gamesToWin; // 棄権により、勝者側が試合に必要なゲーム数を獲得したものとして扱う
  match.status = 'finished';
  match.overallWinner = winnerSide;
  match.finishedAt = state.finishedAt;
  match.retired = true;
  match.retiredSide = retiredSide;

  clearActiveMatchLocal();
  render();
  pushRemote();
  openScoreSheet();
}

function renderSlots(container, team){
  container.innerHTML = '';
  const serverTeam = state.serverTeam;
  const serverPlayer = currentServerPlayer();

  if(settings.matchType === 'singles'){
    // シングルスは両者ともサーバー側の得点の奇偶で立ち位置（右/左コート）が決まる
    const name = settings.players[team][0];
    const refBox = serverBoxOf(serverTeam);
    const isServer = team === serverTeam;
    const slot = document.createElement('div');
    slot.className = 'slot' + (isServer ? ' server' : '');
    slot.textContent = name;
    slot.style.marginLeft = refBox === 'right' ? 'auto' : '0';
    slot.style.marginRight = refBox === 'left' ? 'auto' : '0';
    container.appendChild(slot);
    return;
  }

  const pos = state.positions[team];
  ['right','left'].forEach(box=>{
    const name = pos[box];
    const slot = document.createElement('div');
    const isServer = (team === serverTeam) && (name === serverPlayer);
    slot.className = 'slot' + (isServer ? ' server' : '') + (name ? '' : ' empty');
    slot.textContent = name || '';
    container.appendChild(slot);
  });
}

function renderScoreCards(container, score, style){
  // 「フリップカード」の見た目をやめ、数字だけをシンプルに大きく表示する
  container.innerHTML = '';
  const num = document.createElement('span');
  num.className = 'plain-score-digits';
  num.textContent = String(score);
  if(style){ num.style.fontSize = style.fontSize; }
  container.appendChild(num);
}

function computeCardStyle(leftDigits, rightDigits){
  const zoneL = document.querySelector('#sideLeft .score-zone');
  const zoneR = document.querySelector('#sideRight .score-zone');
  if(!zoneL || !zoneR) return null;

  // 横幅・縦幅の両方を使い切れるよう、余白は最小限にする
  const minW = Math.min(zoneL.clientWidth, zoneR.clientWidth) * 0.96;
  const minH = Math.min(zoneL.clientHeight, zoneR.clientHeight) * 0.96;
  if(minW <= 0 || minH <= 0) return null;

  // 1桁→2桁で見た目のサイズが変わらないよう、最初から常に2桁分の横幅を確保しておく
  // （バドミントンの通常の得点は最大でも2桁のため、これで試合を通して同じ文字サイズを維持できる）
  const maxDigits = Math.max(2, leftDigits, rightDigits);
  // 太字の等幅数字1文字あたりの実測目安（フォントサイズに対する横幅の比率）
  const CHAR_WIDTH_RATIO = 0.62;

  // 横幅だけでなく縦幅も最大限に使うため、両方の制約のうち小さい方に合わせて最大化する
  // （4:3など縦が長い画面でも、横幅だけに引きずられて小さくなり過ぎないようにする）
  let size = Math.min(minH, minW / (maxDigits * CHAR_WIDTH_RATIO));
  size = Math.max(size, 24);

  return { fontSize: size.toFixed(1) + 'px' };
}

function render(){
  if(!state || !match) return;
  const leftTeam = state.leftTeam;
  const rightTeam = otherTeam(leftTeam);

  const leftScoreStr = String(state.score[leftTeam]);
  const rightScoreStr = String(state.score[rightTeam]);
  const cardStyle = computeCardStyle(leftScoreStr.length, rightScoreStr.length);

  renderScoreCards(scoreLeftNum, state.score[leftTeam], cardStyle);
  renderScoreCards(scoreRightNum, state.score[rightTeam], cardStyle);

  sideLeftEl.classList.toggle('serving', state.serverTeam === leftTeam);
  sideRightEl.classList.toggle('serving', state.serverTeam === rightTeam);

  renderSlots(slotsLeft, leftTeam);
  renderSlots(slotsRight, rightTeam);

  undoBtn.disabled = historyStack.length === 0;
  mirrorTaikaLiveScore();

  const gameBadge = document.getElementById('gameBadge');
  const setStatus = document.getElementById('setStatus');
  if(gameBadge){
    gameBadge.textContent = `第${state.gameNumber}ゲーム`;
  }
  if(setStatus){
    setStatus.textContent = match.format === 'best3'
      ? `${match.gameWins[leftTeam]} - ${match.gameWins[rightTeam]}`
      : '';
  }
}

/* ---------- スコアシート ---------- */
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetContent = document.getElementById('sheetContent');

function fmtTeamName(team){
  return settings.players[team].join(' / ');
}

function clubForPlayer(team, playerName){
  const arr=(settings && settings.playerClubs && settings.playerClubs[team]) || currentTeamClubs[team] || [];
  const players=(settings && settings.players && settings.players[team]) || [];
  const idx=players.indexOf(playerName);
  return idx>=0 ? (arr[idx]||'') : '';
}
function fitClubFontSize(club, maxPx=9){
  // 約100px幅を基準に、長い所属名ほど自動的に縮小（印刷時も崩れにくい下限5px）
  const len=Array.from(String(club||'')).length + 2; // （）分
  return Math.max(5, Math.min(maxPx, Math.floor(92/Math.max(1,len))));
}
function playerWithClubHtml(team, playerName, centered=false){
  const club=clubForPlayer(team,playerName);
  const align=centered?'text-align:center;':'';
  return `<span class="sheet-player-name">${playerName}</span>${club?`<span class="sheet-player-club" style="font-size:${fitClubFontSize(club)}px;${align}">（${club}）</span>`:''}`;
}
function fmtTeamNameStacked(team){
  return settings.players[team].map(n=>playerWithClubHtml(team,n,true)).join('<br>');
}

function playerRowsForTeam(team){
  return settings.matchType === 'doubles' ? settings.players[team] : [settings.players[team][0]];
}

function scoreGridPlayerRowHtml(game, team, playerName, totalPoints){
  const isServerStart = game.initialServer === playerName;
  const isReceiverStart = game.initialReceiver === playerName;

  // 列＝試合全体のポイント通し番号(seq)。相手チームの得点とも縦の列が重ならないようにする。
  // 「そのポイントを取った直後に次のサーブを行う選手」の行に、そのチームの得点値を記入する。
  const bySeq = new Map();
  game.pointLog.forEach(p=>{
    if(p.winTeam !== team) return;
    if(p.serverPlayerAfter !== playerName) return;
    const sc = team === 'A' ? p.scoreA : p.scoreB;
    bySeq.set(p.seq, sc);
  });

  let html = `<td class="player-name">${playerWithClubHtml(team, playerName)}</td>`;
  html += `<td class="sr-mark">${isServerStart ? 'S' : (isReceiverStart ? 'R' : '')}</td>`;
  html += `<td class="${(isServerStart || isReceiverStart) ? ('filled' + (team==='B' ? ' team-b' : '')) : ''}">${(isServerStart || isReceiverStart) ? '0' : ''}</td>`;

  for(let seq = 1; seq <= totalPoints; seq++){
    if(bySeq.has(seq)){
      html += `<td class="filled${team === 'B' ? ' team-b' : ''}">${bySeq.get(seq)}</td>`;
    }else{
      html += `<td></td>`;
    }
  }
  return html;
}

function gameSectionHtml(gameIndexLabel, game){
  if(!game){
    return `
      <div class="game-section empty">
        <div class="game-vlabel">${gameIndexLabel}</div>
        <div class="game-empty-note">（未実施）</div>
      </div>
    `;
  }
  const totalPoints = game.pointLog.length;
  const rowsA = playerRowsForTeam('A').map(name=> `<tr>${scoreGridPlayerRowHtml(game, 'A', name, totalPoints)}</tr>`).join('');
  const rowsB = playerRowsForTeam('B').map(name=> `<tr>${scoreGridPlayerRowHtml(game, 'B', name, totalPoints)}</tr>`).join('');
  return `
    <div class="game-section">
      <div class="game-vlabel">${gameIndexLabel}</div>
      <div class="score-grid-wrap">
        <table class="score-grid">
          ${rowsA}
          ${rowsB}
        </table>
      </div>
    </div>
  `;
}

function openScoreSheet(){
  const allGames = match.games;

  const startDt = new Date(match.startedAt);
  const finishDt = new Date(match.finishedAt || Date.now());
  const dateStr = startDt.toLocaleDateString('ja-JP');
  const startTimeStr = startDt.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });
  const endTimeStr = finishDt.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });

  const statusLabel = match.status === 'aborted' ? '（試合中止）' : (match.retired ? `（${fmtTeamName(match.retiredSide)} 棄権）` : '');
  const winnerName = match.overallWinner ? fmtTeamName(match.overallWinner) : null;
  const eventLabel = settings.matchType === 'doubles' ? 'ダブルス' : 'シングルス';

  const infoLine = (label, value, wrap)=> `<div class="info-line${wrap?' val-wrap':''}"><span class="lbl">${label}：</span><span class="val">${value || ''}</span></div>`;

  const gameSummaryRow = (g)=> g ? `<td class="mini-score">${g.score.A} － ${g.score.B}</td>` : `<td class="mini-score">－</td>`;

  const numGameSlots = match.format === 'best3' ? 3 : 1;
  const gameLabels = ['第一ゲーム', '第二ゲーム', '第三ゲーム'];
  const gamesHtml = Array.from({ length: numGameSlots }).map((_, i)=>
    gameSectionHtml(gameLabels[i], allGames[i] || null)
  ).join('');

  sheetContent.innerHTML = `
    <h2 style="text-align:center;">ス　コ　ア　シ　ー　ト（得点用紙）${statusLabel}</h2>
    <div class="sheet-header-grid">
      ${infoLine('期日', dateStr)}
      ${infoLine('種目', eventLabel)}
      ${infoLine('大会名', settings.tournamentName, true)}
      ${infoLine('試合番号', settings.matchNumber)}
      ${infoLine('場所', settings.venueName)}
      ${infoLine('コート番号', settings.courtNumber)}
      ${infoLine('開始時間', startTimeStr)}
      ${infoLine('終了時間', endTimeStr)}
      <table class="name-score-table">
        <tr>
          <td class="lr-tab" rowspan="${numGameSlots}">L</td>
          <td class="name-box" rowspan="${numGameSlots}">${fmtTeamNameStacked('A')}</td>
          <td class="game-count" rowspan="${numGameSlots}">${match.gameWins.A}</td>
          ${gameSummaryRow(allGames[0])}
          <td class="game-count" rowspan="${numGameSlots}">${match.gameWins.B}</td>
          <td class="name-box" rowspan="${numGameSlots}">${fmtTeamNameStacked('B')}</td>
          <td class="lr-tab" rowspan="${numGameSlots}">R</td>
        </tr>
        ${numGameSlots > 1 ? `<tr>${gameSummaryRow(allGames[1])}</tr>` : ''}
        ${numGameSlots > 2 ? `<tr>${gameSummaryRow(allGames[2])}</tr>` : ''}
      </table>
    </div>

    ${winnerName ? `<div class="sub">勝者：${winnerName}</div>` : ''}

    ${gamesHtml}

    <div class="sign-row">
      <div class="sign-cell">勝者署名　＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
      <div class="sign-cell">主審署名　＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
      <div class="sign-cell">コール時間　${endTimeStr}</div>
    </div>
    <div class="sheet-btns">
      ${match.status === 'finished' ? '<button class="print-btn" id="sheetUndoBtn">Undo</button>' : ''}
      <button class="print-btn" id="printBtn">印刷 / PDF保存</button>
      <button class="new-btn" id="newMatchBtn">終了</button>
    </div>
  `;

  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('newMatchBtn').addEventListener('click', ()=>{
    if(taikaLink && taikaLink.enabled){
      notifyTaikaMatchFinished({
        status: match.status,
        winner: match.overallWinner,
        gameWinsA: match.gameWins.A,
        gameWinsB: match.gameWins.B,
        teamA: settings.players.A,
        teamB: settings.players.B,
        finishedAt: match.finishedAt,
        retired: !!match.retired,
        retiredSide: match.retired ? match.retiredSide : null
      });
    }
    archiveMatch();
    sheetOverlay.classList.remove('active');
    // 大会Now連携時は、終了後に次試合を自分で作成せず、運営側からの配信を待つ。
    // 現在試合の表示をクリアし、設定画面を「待機状態」として使う。
    if(taikaLink && taikaLink.enabled){
      lastTaikaMatchId = null;
      ['nameA1','nameA2','nameB1','nameB2'].forEach((id)=>{
        const el=document.getElementById(id); if(el) el.value='';
      });
      currentTeamClubs = {A:['',''], B:['','']};
      renderTeamClubs();
      refreshPlayerSelects();
      state = null;
      match = null;
      clearActiveMatchLocal();
    }
    showSettings();
    if(taikaLink && taikaLink.enabled){
      const startBtn=document.getElementById('startBtn');
      if(startBtn) startBtn.disabled=true;
      renderTaikaStatusHint({status:'idle', match:null});
    }
  });
  const sheetUndoBtn = document.getElementById('sheetUndoBtn');
  if(sheetUndoBtn){
    sheetUndoBtn.addEventListener('click', undoFinalPoint);
  }

  sheetOverlay.classList.add('active');
}

function archiveMatch(){
  if(!dbReady || !matchesRef || !match) return;
  try{
    matchesRef.push({
      finishedAt: match.finishedAt || Date.now(),
      settings,
      gameWins: match.gameWins,
      overallWinner: match.overallWinner,
      status: match.status,
      games: match.games
    });
  }catch(e){ console.warn('archive失敗', e); }
}

/* ---------- 過去の試合一覧（設定画面） ---------- */
function renderPastMatches(){
  const wrap = document.getElementById('pastMatchesWrap');
  const list = document.getElementById('pastMatchesList');
  if(!dbReady || !matchesRef){ wrap.style.display = 'none'; return; }

  matchesRef.orderByChild('finishedAt').limitToLast(10).once('value').then(snap=>{
    const items = [];
    snap.forEach(child=>{ items.push({ id: child.key, ...child.val() }); });
    items.reverse();
    if(items.length === 0){ wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    list.innerHTML = items.map(m=>{
      const d = new Date(m.finishedAt);
      const names = `${m.settings.players.A.join('/')} vs ${m.settings.players.B.join('/')}`;
      const gw = m.gameWins || {A:0,B:0};
      return `<div class="past-row"><span>${d.toLocaleDateString('ja-JP')} ${names} ${gw.A}-${gw.B}</span></div>`;
    }).join('');
  }).catch(()=>{ wrap.style.display = 'none'; });
}

/* ---------- Firebase 同期 ---------- */
function pushRemote(){
  if(taikaLink && taikaLink.enabled && !hasCourtOperationRight()) return;
  // Firebaseの接続状態にかかわらず、まず端末内へ保存する
  saveActiveMatchLocal();
  if(!dbReady || !matchRef) return;
  suppressRemote = true;
  matchRef.set({ deviceId: DEVICE_ID, settings, state, match }).catch(e=>console.warn('sync失敗', e));
  clearTimeout(remoteApplyTimer);
  remoteApplyTimer = setTimeout(()=>{ suppressRemote = false; }, 800);
}

// matchRefListenerTarget は先頭付近で宣言済み（TDZ回避のためここでは宣言しない）
function subscribeMatchRef(){
  if(!dbReady) return;
  if(matchRefListenerTarget){
    try{ matchRefListenerTarget.off('value'); }catch(e){}
  }
  matchRefListenerTarget = matchRef;
  matchRef.on('value', snap=>{
    try{
      const val = snap.val();
      if(!val || !val.state || !val.match || !val.match.gameWins) return; // 旧形式データ等は無視
      if(val.match.status !== 'ongoing') return; // 終了・中止済みの試合は復元しない（開き直したら新規試合へ）
      if(val.deviceId === DEVICE_ID) return;
      if(suppressRemote) return;
      if(state && val.state.rev <= state.rev) return;

      settings = val.settings;
      state = val.state;
      match = val.match;
      historyStack = [];
      saveActiveMatchLocal();
      showBoard();
      render();
    }catch(e){
      console.warn('リモート同期データの反映に失敗しました（無視します）', e);
    }
  });
}
subscribeMatchRef();

/* ---------- 画面向き変更時の再描画 ---------- */
window.addEventListener('resize', ()=>{ if(state) render(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(state) render(); }, 200); });

/* ---------- 再読み込み・タブ終了直前にも最新状態を保存 ---------- */
window.addEventListener('pagehide', saveActiveMatchLocal);
window.addEventListener('beforeunload', saveActiveMatchLocal);

/* ---------- 初期表示 ---------- */
// 進行中データが端末内に残っていれば盤面を即時復元。なければ通常の設定画面へ。
if(!restoreActiveMatchLocal()) showSettings();
